blueprint:
  name: "Air Quality Window Ventilation"
  description: >-
    Открывает выбранные окна при превышении порога CO₂ или TVOC,
    если температура позволяет проветривание. Закрывает окна, когда
    все показатели воздуха снизятся до порогов закрытия.

    Если температура остаётся ниже заданного порога, окна закрываются
    после указанной задержки, даже при высоких CO₂/TVOC. Прогрев отменяет
    отсчёт. Изменения CO₂/TVOC не сбрасывают задержку.

    При недоступных показаниях окна закрываются. Управление распространяется
    на все выбранные окна, в том числе открытые вручную.
    После перезапуска Home Assistant или перезагрузки автоматизации
    задержка по температуре отсчитывается заново. Помощник таймера не нужен.
    Причины команд открытия и закрытия записываются в Activity выбранного окна.
  domain: automation
  homeassistant:
    min_version: 2025.9.0

  input:
    room_section:
      name: "Комната и окна"
      icon: mdi:window-open
      collapsed: false
      input:
        room_area:
          name: "Комната (Area)"
          description: >-
            Область для поиска комнатных датчиков температуры.
            Окна выбираются отдельно: управление всей областью не выполняется.
          default: ""
          selector:
            area: {}
        window_entities:
          name: "Окна"
          description: "Только выбранные cover-сущности будут открываться и закрываться."
          selector:
            entity:
              multiple: true
              filter:
                - domain: cover

    opening_section:
      name: "Уровень открытия при проветривании"
      icon: mdi:window-shutter-open
      collapsed: false
      input:
        sensor_opening_entity:
          name: "Лимит открытия по датчикам (опционально)"
          description: >-
            Number-сущность ограничения открытия выбранного окна или группы
            (например, Opening limit). Сначала задаётся лимит, затем отправляется
            команда открытия через cover. Без выбора — открытие с текущим
            лимитом привода. Закрытие выполняется через cover.
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        sensor_opening_percentage:
          name: "Максимальное открытие по датчикам"
          description: "Лимит в процентах для выбранной выше number-сущности."
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    co2_section:
      name: "CO₂"
      icon: mdi:molecule-co2
      collapsed: false
      input:
        co2_sensors:
          name: "Датчики CO₂ (опционально)"
          description: >-
            Можно выбрать один или несколько датчиков в ppm.
            Оставьте пустым, если используется только TVOC.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: carbon_dioxide
        co2_open_threshold:
          name: "CO₂: открыть при превышении значения"
          default: 1200
          selector:
            number:
              min: 0
              max: 10000
              step: 50
              unit_of_measurement: ppm
              mode: box
        co2_close_threshold:
          name: "CO₂: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 800
          selector:
            number:
              min: 0
              max: 10000
              step: 50
              unit_of_measurement: ppm
              mode: box

    tvoc_section:
      name: "TVOC"
      icon: mdi:air-filter
      collapsed: false
      input:
        tvoc_sensors:
          name: "Датчики TVOC (опционально)"
          description: >-
            Пороги задаются в тех же единицах, что и показания датчика.
            Не смешивайте ppb и µg/m³ в одном списке.
            Оставьте пустым, если используется только CO₂.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
        tvoc_open_threshold:
          name: "TVOC: открыть при превышении значения"
          default: 500
          selector:
            number:
              min: 0
              max: 100000
              step: 1
              mode: box
        tvoc_close_threshold:
          name: "TVOC: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 250
          selector:
            number:
              min: 0
              max: 100000
              step: 1
              mode: box

    temperature_section:
      name: "Температура комнаты"
      icon: mdi:home-thermometer
      collapsed: false
      input:
        temperature_sensors:
          name: "Датчики температуры (опционально)"
          description: >-
            Если список пуст, используются sensor-сущности с device_class
            temperature в выбранной Area. Из всех датчиков берётся самая
            низкая температура. Можно выбрать конкретные комнатные датчики,
            чтобы исключить неподходящие датчики из автоматического поиска.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: temperature
        temperature_close_threshold:
          name: "Закрыть окно при снижении температуры ниже значения"
          default: 20
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        temperature_reopen_threshold:
          name: "Разрешить открытие при превышении заданной температуры"
          description: "Должен быть выше температурного порога закрытия."
          default: 22
          selector:
            number:
              min: 5
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        temperature_close_delay:
          name: "Задержка закрытия при снижении температуры"
          description: >-
            Сколько минут температура должна оставаться ниже порога
            закрытия после снижения. Затем окно закроется даже при высоких
            CO₂ и TVOC. Прогрев выше порога отменяет закрытие по холоду.
            0 = закрыть сразу. Показания CO₂ и TVOC не сбрасывают отсчёт.
            Помощник таймера не нужен. После перезапуска HA или перезагрузки
            автоматизации задержка по холоду отсчитывается заново.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 0.5
              unit_of_measurement: "мин"
              mode: box

# Один запуск сопровождает открытые окна. Новые показания пробуждают ожидание,
# но не перезапускают отсчёт закрытия по температуре.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input co2_sensors
    to: null
  - trigger: state
    entity_id: !input tvoc_sensors
    to: null
  - trigger: state
    entity_id: !input temperature_sensors
    to: null
  - trigger: state
    entity_id: !input window_entities
    to: null
  - trigger: homeassistant
    event: start
  # Проверка также находит датчики температуры, добавленные в Area.
  - trigger: time_pattern
    minutes: "/1"

variables:
  selected_area: !input room_area
  selected_temperature_sensors: !input temperature_sensors
  windows: !input window_entities
  co2_entities: !input co2_sensors
  tvoc_entities: !input tvoc_sensors
  co2_open: !input co2_open_threshold
  co2_close: !input co2_close_threshold
  tvoc_open: !input tvoc_open_threshold
  tvoc_close: !input tvoc_close_threshold
  minimum_temperature: !input temperature_close_threshold
  reopening_temperature: !input temperature_reopen_threshold
  cold_close_delay: !input temperature_close_delay
  sensor_opening_entity: !input sensor_opening_entity
  sensor_opening_percentage: !input sensor_opening_percentage

conditions:
  - condition: template
    alias: "Выбраны датчики и заданы корректные пороги"
    value_template: >-
      {{ windows | count > 0
         and co2_entities | count + tvoc_entities | count > 0
         and (co2_entities | count == 0 or co2_open | float > co2_close | float)
         and (tvoc_entities | count == 0 or tvoc_open | float > tvoc_close | float)
         and reopening_temperature | float > minimum_temperature | float }}

actions:
  - variables:
      cold_since: 0
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}"
      sequence:
        - variables:
            temperature_entities: >-
              {{ selected_temperature_sensors if selected_temperature_sensors | count > 0
                 else area_entities(selected_area)
                 | select('match', '^sensor[.]')
                 | select('is_state_attr', 'device_class', 'temperature') | list }}
            observed_entities: "{{ (co2_entities + tvoc_entities + temperature_entities + windows) | unique | list }}"
            observed_states: "{{ observed_entities | map('states') | list }}"
            readings: >-
              {% set ns = namespace(valid=true, high=false, recovered=true, high_sources=[],
                                    temperatures=[], tvoc_units=[]) %}
              {% for entity in co2_entities + tvoc_entities %}
                {% set value = states(entity) %}
                {% set unit = state_attr(entity, 'unit_of_measurement') %}
                {% if not is_number(value) or value | float < 0 %}
                  {% set ns.valid = false %}
                {% else %}
                  {% set value = value | float %}
                  {% if entity in co2_entities %}
                    {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
                    {% set ns.high = ns.high or value >= co2_open | float %}
                    {% if value >= co2_open | float %}
                      {% set ns.high_sources = ns.high_sources
                         + ['CO₂ (' ~ entity ~ '): ' ~ value ~ ' ppm ≥ ' ~ co2_open ~ ' ppm'] %}
                    {% endif %}
                    {% set ns.recovered = ns.recovered and value <= co2_close | float %}
                  {% endif %}
                  {% if entity in tvoc_entities %}
                    {% set ns.tvoc_units = ns.tvoc_units + [unit] %}
                    {% set ns.high = ns.high or value >= tvoc_open | float %}
                    {% if value >= tvoc_open | float %}
                      {% set ns.high_sources = ns.high_sources
                         + ['TVOC (' ~ entity ~ '): ' ~ value ~ ' ≥ ' ~ tvoc_open ~ ' ' ~ (unit or '')] %}
                    {% endif %}
                    {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% for entity in temperature_entities %}
                {% set value = states(entity) %}
                {% set unit = state_attr(entity, 'unit_of_measurement') %}
                {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
                  {% set ns.valid = false %}
                {% else %}
                  {% set value = value | float %}
                  {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
                     else value - 273.15 if unit == 'K' else value %}
                  {% set ns.temperatures = ns.temperatures + [celsius | round(3)] %}
                {% endif %}
              {% endfor %}
              {{ dict(valid=ns.valid and ns.temperatures | count > 0
                           and ns.tvoc_units | unique | list | count <= 1,
                      high=ns.high, high_sources=ns.high_sources, recovered=ns.recovered,
                      temperature=ns.temperatures | min if ns.temperatures | count > 0 else none) }}
            open_windows: >-
              {{ windows | select('is_state', 'open') | list
                 + windows | select('is_state', 'opening') | list }}
            cold_since: >-
              {{ (cold_since if cold_since | float > 0 else as_timestamp(now()))
                 if readings.valid and readings.temperature <= minimum_temperature | float
                    and open_windows | count > 0 else 0 }}
            cold_close_due: >-
              {{ cold_since | float > 0
                 and as_timestamp(now()) - cold_since | float >= cold_close_delay | float * 60 }}

        - choose:
            - conditions:
                - condition: template
                  alias: "Воздух нормализовался, показания потеряны или истекла задержка по холоду"
                  value_template: "{{ not readings.valid or readings.recovered or cold_close_due }}"
              sequence:
                - repeat:
                    for_each: "{{ open_windows }}"
                    sequence:
                      - action: logbook.log
                        continue_on_error: true
                        data:
                          name: "{{ state_attr(this.entity_id, 'friendly_name') or 'Проветривание' }}"
                          entity_id: "{{ repeat.item }}"
                          domain: cover
                          message: >-
                            Команда закрытия:
                            {% if not readings.valid %}
                              недоступные или некорректные показания датчиков воздуха или температуры.
                            {% elif readings.recovered %}
                              все выбранные показатели CO₂/TVOC снизились до порогов закрытия.
                            {% else %}
                              температура {{ readings.temperature }} °C ≤ {{ minimum_temperature }} °C
                              в течение {{ cold_close_delay }} мин.
                            {% endif %}
                      - action: cover.close_cover
                        continue_on_error: true
                        target:
                          entity_id: "{{ repeat.item }}"
                - stop: "Проветривание завершено"

            - conditions:
                - condition: template
                  alias: "Воздух требует проветривания и комната прогрета"
                  value_template: >-
                    {{ readings.high and readings.temperature >= reopening_temperature | float
                       and windows | select('is_state', 'closed') | list | count > 0 }}
              sequence:
                - variables:
                    closed_windows: "{{ windows | select('is_state', 'closed') | list }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ sensor_opening_entity | length > 0 }}"
                      sequence:
                        - action: number.set_value
                          target:
                            entity_id: "{{ sensor_opening_entity }}"
                          data:
                            value: "{{ sensor_opening_percentage | float }}"
                - repeat:
                    for_each: "{{ closed_windows }}"
                    sequence:
                      - action: logbook.log
                        continue_on_error: true
                        data:
                          name: "{{ state_attr(this.entity_id, 'friendly_name') or 'Проветривание' }}"
                          entity_id: "{{ repeat.item }}"
                          domain: cover
                          message: >-
                            Команда открытия: {{ readings.high_sources | join('; ') }}.
                            Температура {{ readings.temperature }} °C ≥ {{ reopening_temperature }} °C.
                      - action: cover.open_cover
                        continue_on_error: true
                        target:
                          entity_id: "{{ repeat.item }}"

        - if:
            - condition: template
              value_template: >-
                {{ windows | select('is_state', 'open') | list | count == 0
                   and windows | select('is_state', 'opening') | list | count == 0 }}
          then:
            - stop: "Открытых окон нет"

        - wait_template: >-
            {{ observed_entities | map('states') | list != observed_states }}
          timeout:
            seconds: >-
              {{ [1, [60, cold_close_delay | float * 60
                          - (as_timestamp(now()) - cold_since | float)] | min] | max
                 if cold_since | float > 0 else 60 }}
          continue_on_timeout: true
