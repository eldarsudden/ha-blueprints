blueprint:
  name: "Air Quality Window Ventilation"
  description: >-
    По CO₂/TVOC: открывает закрытые окна при превышении порога любого
    датчика, если температура позволяет проветривание. При снижении всех
    показателей до порогов закрытия закрывает только окна, открытые этой
    автоматизацией. На уже открытые вручную окна показания CO₂/TVOC не влияют.

    По температуре: если температура остаётся ниже заданного порога,
    закрывает окна после указанной задержки, включая открытые вручную.
    Для каждого окна время отсчитывается отдельно с момента похолодания
    или его открытия в уже холодной комнате. Прогрев отменяет отсчёт.
    Изменения CO₂/TVOC не сбрасывают температурную задержку.

    Окна, открытые вручную, закрываются по температуре с указанной задержкой.
    Нормальные CO₂/TVOC не закрывают их и не отменяют температурный таймер.
    Недоступные или некорректные показания блокируют новое открытие,
    но сами по себе не закрывают окно. Закрытие по CO₂/TVOC требует
    корректных показаний всех датчиков воздуха; температурный таймер
    зависит только от датчиков температуры. При потере температуры
    отсчёт сбрасывается и начинается заново после восстановления показаний.
    После перезапуска Home Assistant или перезагрузки автоматизации
    открытые окна считаются ручными, задержка по температуре отсчитывается
    заново. Помощник таймера не нужен.
    Показания проверяются при изменениях датчиков и раз в минуту.
    Новый запуск появляется в Activity, только если есть открытые окна
    или выполнены условия открытия по воздуху и температуре.
    Причины команд открытия и закрытия записываются в Activity выбранного окна.
    После каждой команды устройству выдерживается пауза 1 секунда.
    Необязательно: отдельный датчик температуры у окна (например O-Air)
    уменьшает базовый Opening limit, заданный во входе blueprint:
    100/75/50/25% базы для четырёх температурных диапазонов.
    Значение устройства не используется как база. Комнатная температура
    по-прежнему отдельно управляет защитой от переохлаждения комнаты.
  domain: automation
  source_url: https://github.com/eldarsudden/ha-blueprints/blob/master/air-quality-window-ventilation.yaml
  homeassistant:
    min_version: 2025.9.0

  input:
    room_section:
      name: "Комната и окна"
      icon: mdi:window-open
      collapsed: false
      input:
        room_area:
          name: "Комната (Area)"
          description: >-
            Область для поиска комнатных датчиков температуры.
            Окна выбираются отдельно: управление всей областью не выполняется.
          default: ""
          selector:
            area:
              multiple: false
              reorder: false
        window_entities:
          name: "Окна"
          description: "Только выбранные cover-сущности будут открываться и закрываться."
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - cover
              reorder: false

    opening_section:
      name: "Уровень открытия при проветривании"
      icon: mdi:window-shutter-open
      collapsed: false
      input:
        sensor_opening_entity:
          name: "Лимит открытия по датчикам (опционально)"
          description: >-
            Number-сущность ограничения открытия выбранного окна или группы
            (например, Opening limit). Сначала задаётся лимит, затем отправляется
            команда открытия через cover. Без выбора — открытие с текущим
            лимитом привода. Закрытие выполняется через cover.
          default: ""
          selector:
            entity:
              filter:
              - domain:
                - number
              multiple: false
              reorder: false
        sensor_opening_percentage:
          name: "Базовый Opening limit"
          description: >-
            База температурной кривой, задаваемая только здесь, в blueprint.
            При базе 15% ступени составят 15/11/8/4% хода привода.
            Текущее значение Opening limit на устройстве не считывается
            для формирования базы или ступеней. Без наружного датчика
            это обычный фиксированный лимит открытия.
          default: 15
          selector:
            number:
              min: 1.0
              max: 100.0
              step: 1.0
              unit_of_measurement: '%'
              mode: slider

    outdoor_section:
      name: "Температура у окна · поправка Opening limit"
      icon: mdi:thermometer-low
      collapsed: true
      input:
        outdoor_temperature_sensors:
          name: "Датчик температуры O-Air / у окна (опционально)"
          description: >-
            Приближённый ориентир наружной температуры; при нескольких
            датчиках используется минимум. Не включайте их в комнатные
            датчики: из автоматического поиска температуры комнаты они
            исключаются. Для поправки выберите number-сущность Opening limit.
            Без наружного датчика поправка отключена. При некорректных
            показаниях используется самая осторожная ступень — 25% базы.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              reorder: false
        outdoor_warm_threshold:
          name: "100% базы при температуре от"
          default: 15
          selector:
            number:
              min: -40.0
              max: 40.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        outdoor_cool_threshold:
          name: "75% базы при температуре от"
          default: 10
          selector:
            number:
              min: -40.0
              max: 40.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        outdoor_cold_threshold:
          name: "50% базы при температуре от; ниже — 25%"
          default: 0
          selector:
            number:
              min: -40.0
              max: 40.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        outdoor_hysteresis:
          name: "Запас температуры для увеличения открытия"
          default: 1
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        outdoor_warmup_seconds:
          name: "Стабильное потепление перед увеличением открытия"
          description: "Уменьшение лимита при похолодании применяется сразу; увеличение — после этой выдержки."
          default: 120
          selector:
            number:
              min: 0.0
              max: 1800.0
              step: 30.0
              unit_of_measurement: s
              mode: box

    co2_section:
      name: "CO₂"
      icon: mdi:molecule-co2
      collapsed: false
      input:
        co2_sensors:
          name: "Датчики CO₂ (опционально)"
          description: >-
            Можно выбрать один или несколько датчиков в ppm.
            Оставьте пустым, если используется только TVOC.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                device_class:
                - carbon_dioxide
              reorder: false
        co2_open_threshold:
          name: "CO₂: открыть при превышении значения"
          default: 1200
          selector:
            number:
              min: 0.0
              max: 10000.0
              step: 50.0
              unit_of_measurement: ppm
              mode: box
        co2_close_threshold:
          name: "CO₂: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 800
          selector:
            number:
              min: 0.0
              max: 10000.0
              step: 50.0
              unit_of_measurement: ppm
              mode: box

    tvoc_section:
      name: "TVOC"
      icon: mdi:air-filter
      collapsed: false
      input:
        tvoc_sensors:
          name: "Датчики TVOC (опционально)"
          description: >-
            Пороги задаются в тех же единицах, что и показания датчика.
            Не смешивайте ppb и µg/m³ в одном списке.
            Оставьте пустым, если используется только CO₂.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
              reorder: false
        tvoc_open_threshold:
          name: "TVOC: открыть при превышении значения"
          default: 500
          selector:
            number:
              min: 0.0
              max: 100000.0
              step: 1.0
              mode: box
        tvoc_close_threshold:
          name: "TVOC: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 250
          selector:
            number:
              min: 0.0
              max: 100000.0
              step: 1.0
              mode: box

    temperature_section:
      name: "Температура комнаты"
      icon: mdi:home-thermometer
      collapsed: false
      input:
        temperature_sensors:
          name: "Датчики температуры (опционально)"
          description: >-
            Если список пуст, используются sensor-сущности с device_class
            temperature в выбранной Area. Из всех датчиков берётся самая
            низкая температура. Можно выбрать конкретные комнатные датчики,
            чтобы исключить неподходящие датчики из автоматического поиска.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              reorder: false
        temperature_close_threshold:
          name: "Закрыть окно при снижении температуры ниже значения"
          default: 20
          selector:
            number:
              min: 5.0
              max: 35.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        temperature_reopen_threshold:
          name: "Разрешить открытие при превышении заданной температуры"
          description: "Должен быть выше температурного порога закрытия."
          default: 22
          selector:
            number:
              min: 5.0
              max: 40.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        temperature_close_delay:
          name: "Задержка закрытия при снижении температуры"
          description: >-
            Сколько минут температура должна оставаться ниже порога
            закрытия после снижения. Затем окно закроется даже при высоких
            CO₂ и TVOC. Прогрев выше порога отменяет закрытие по холоду.
            0 = закрыть сразу. Показания CO₂ и TVOC не сбрасывают отсчёт.
            Помощник таймера не нужен. После перезапуска HA или перезагрузки
            автоматизации задержка по холоду отсчитывается заново.
          default: 0
          selector:
            number:
              min: 0.0
              max: 60.0
              step: 0.5
              unit_of_measurement: мин
              mode: box

# Один запуск сопровождает открытые окна. Новые показания пробуждают ожидание,
# но не перезапускают отсчёт закрытия по температуре.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input co2_sensors
    to: null
  - trigger: state
    entity_id: !input tvoc_sensors
    to: null
  - trigger: state
    entity_id: !input temperature_sensors
    to: null
  - trigger: state
    entity_id: !input outdoor_temperature_sensors
    to: null
  - trigger: state
    entity_id: !input window_entities
    to: null
  - trigger: homeassistant
    event: start
  # Проверка также находит датчики температуры, добавленные в Area.
  - trigger: time_pattern
    minutes: "/1"

variables:
  selected_area: !input room_area
  selected_temperature_sensors: !input temperature_sensors
  windows: !input window_entities
  co2_entities: !input co2_sensors
  tvoc_entities: !input tvoc_sensors
  co2_open: !input co2_open_threshold
  co2_close: !input co2_close_threshold
  tvoc_open: !input tvoc_open_threshold
  tvoc_close: !input tvoc_close_threshold
  minimum_temperature: !input temperature_close_threshold
  reopening_temperature: !input temperature_reopen_threshold
  cold_close_delay: !input temperature_close_delay
  sensor_opening_entity: !input sensor_opening_entity
  sensor_opening_percentage: !input sensor_opening_percentage
  outdoor_temperature_entities: !input outdoor_temperature_sensors
  outdoor_warm: !input outdoor_warm_threshold
  outdoor_cool: !input outdoor_cool_threshold
  outdoor_cold: !input outdoor_cold_threshold
  outdoor_hysteresis: !input outdoor_hysteresis
  outdoor_warmup_seconds: !input outdoor_warmup_seconds
  outdoor_thresholds_valid: "{{ outdoor_warm | float > outdoor_cool | float > outdoor_cold | float }}"

  temperature_entities: &temperature_entities_template >-
    {% set candidates = selected_temperature_sensors if selected_temperature_sensors | count > 0
       else area_entities(selected_area) | select('match', '^sensor[.]')
       | select('is_state_attr', 'device_class', 'temperature') | list %}
    {{ candidates | reject('in', outdoor_temperature_entities) | list }}
  readings: &readings_template >-
    {% set ns = namespace(air_valid=true, temperature_valid=true, errors=[],
                          high=false, recovered=true, high_sources=[],
                          temperatures=[], tvoc_units=[], outdoor_values=[], outdoor_valid=true) %}
    {% for entity in co2_entities + tvoc_entities %}
      {% set value = states(entity) %}
      {% set unit = state_attr(entity, 'unit_of_measurement') %}
      {% if not is_number(value) or value | float < 0 %}
        {% set ns.air_valid = false %}
        {% set ns.errors = ns.errors
           + [entity ~ ': состояние «' ~ value ~ '», ожидалось неотрицательное число'] %}
      {% else %}
        {% set value = value | float %}
        {% if entity in co2_entities %}
          {% if unit != 'ppm' %}
            {% set ns.air_valid = false %}
            {% set ns.errors = ns.errors
               + [entity ~ ': единица «' ~ (unit or 'не задана') ~ '», ожидалась ppm'] %}
          {% endif %}
          {% set ns.high = ns.high or value >= co2_open | float %}
          {% if value >= co2_open | float %}
            {% set ns.high_sources = ns.high_sources
               + ['CO₂ (' ~ entity ~ '): ' ~ value ~ ' ppm ≥ ' ~ co2_open ~ ' ppm'] %}
          {% endif %}
          {% set ns.recovered = ns.recovered and value <= co2_close | float %}
        {% endif %}
        {% if entity in tvoc_entities %}
          {% set ns.tvoc_units = ns.tvoc_units + [unit] %}
          {% set ns.high = ns.high or value >= tvoc_open | float %}
          {% if value >= tvoc_open | float %}
            {% set ns.high_sources = ns.high_sources
               + ['TVOC (' ~ entity ~ '): ' ~ value ~ ' ≥ ' ~ tvoc_open ~ ' ' ~ (unit or '')] %}
          {% endif %}
          {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if ns.tvoc_units | unique | list | count > 1 %}
      {% set ns.errors = ns.errors
         + ['TVOC (' ~ (tvoc_entities | join(', ')) ~ '): разные единицы измерения — '
            ~ (ns.tvoc_units | map('string') | unique | join(', '))] %}
    {% endif %}
    {% if temperature_entities | count == 0 %}
      {% set ns.errors = ns.errors
         + ['Датчики температуры не выбраны и не найдены в Area «' ~ selected_area ~ '»'] %}
    {% endif %}
    {% for entity in temperature_entities %}
      {% set value = states(entity) %}
      {% set unit = state_attr(entity, 'unit_of_measurement') %}
      {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
        {% set ns.temperature_valid = false %}
        {% set ns.errors = ns.errors
           + [entity ~ ': состояние «' ~ value ~ '», единица «' ~ (unit or 'не задана')
              ~ '», ожидалась числовая температура в °C, °F или K'] %}
      {% else %}
        {% set value = value | float %}
        {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
           else value - 273.15 if unit == 'K' else value %}
        {% set ns.temperatures = ns.temperatures + [celsius | round(3)] %}
      {% endif %}
    {% endfor %}
    {% for entity in outdoor_temperature_entities %}
      {% set value = states(entity) %}
      {% set unit = state_attr(entity, 'unit_of_measurement') %}
      {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
        {% set ns.outdoor_valid = false %}
        {% set ns.errors = ns.errors + [entity ~ ': некорректная температура у окна; лимит 25% базы'] %}
      {% else %}
        {% set value = value | float %}
        {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
           else value - 273.15 if unit == 'K' else value %}
        {% set ns.outdoor_values = ns.outdoor_values + [celsius | round(3)] %}
      {% endif %}
    {% endfor %}
    {% set air_valid = ns.air_valid and co2_entities | count + tvoc_entities | count > 0
                       and ns.tvoc_units | unique | list | count <= 1 %}
    {% set temperature_valid = ns.temperature_valid and ns.temperatures | count > 0 %}
    {{ dict(valid=air_valid and temperature_valid,
            air_valid=air_valid, temperature_valid=temperature_valid,
            errors=ns.errors, high=ns.high, high_sources=ns.high_sources, recovered=ns.recovered,
            temperature=ns.temperatures | min if ns.temperatures | count > 0 else none,
            outdoor_enabled=outdoor_temperature_entities | count > 0,
            outdoor_valid=ns.outdoor_valid and ns.outdoor_values | count > 0,
            outdoor_temperature=ns.outdoor_values | min if ns.outdoor_values | count > 0 else none) }}

conditions:
  - condition: template
    alias: "Выбраны датчики и заданы корректные пороги"
    value_template: >-
      {{ windows | count > 0
         and co2_entities | count + tvoc_entities | count > 0
         and (co2_entities | count == 0 or co2_open | float > co2_close | float)
         and (tvoc_entities | count == 0 or tvoc_open | float > tvoc_close | float)
         and reopening_temperature | float > minimum_temperature | float }}

  # Отсекаем пустые запуски до действий: они не попадают в Activity.
  # Открытые вручную окна тоже требуют сопровождения по температуре.
  - condition: template
    alias: "Есть открытые окна или выполнены условия открытия"
    value_template: >-
      {{ windows | select('is_state', 'open') | list | count > 0
         or windows | select('is_state', 'opening') | list | count > 0
         or (readings.valid and readings.high
             and readings.temperature >= reopening_temperature | float
             and (not readings.outdoor_enabled
                  or (sensor_opening_entity | length > 0 and outdoor_thresholds_valid))
             and windows | select('is_state', 'closed') | list | count > 0) }}

actions:
  - variables:
      cold_since: {}
      automatic_windows: []
      outdoor_band: null
      warming_since: null
      warming_target: null
      last_applied_opening_limit: null
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}"
      sequence:
        - variables:
            temperature_entities: *temperature_entities_template
            observed_entities: "{{ (co2_entities + tvoc_entities + temperature_entities + outdoor_temperature_entities + windows) | unique | list }}"
            observed_states: "{{ observed_entities | map('states') | list }}"
            readings: *readings_template
            nominal_outdoor_band: >-
              {% if not readings.outdoor_enabled %}0
              {% elif not readings.outdoor_valid or not outdoor_thresholds_valid %}3
              {% elif readings.outdoor_temperature >= outdoor_warm | float %}0
              {% elif readings.outdoor_temperature >= outdoor_cool | float %}1
              {% elif readings.outdoor_temperature >= outdoor_cold | float %}2
              {% else %}3{% endif %}
            candidate_outdoor_band: >-
              {% set nominal = nominal_outdoor_band | int %}
              {% if outdoor_band is none or nominal >= outdoor_band | int %}
                {{ nominal }}
              {% else %}
                {% set boundaries = [outdoor_warm | float, outdoor_cool | float, outdoor_cold | float] %}
                {% set ns = namespace(band=outdoor_band | int) %}
                {% for band in range(outdoor_band | int, nominal, -1) %}
                  {% if ns.band == band and readings.outdoor_temperature >= boundaries[band - 1] + outdoor_hysteresis | float %}
                    {% set ns.band = band - 1 %}
                  {% endif %}
                {% endfor %}
                {{ ns.band }}
              {% endif %}
            warming_since: >-
              {{ (warming_since if warming_since is not none and warming_target == candidate_outdoor_band | int
                  else as_timestamp(now()))
                 if outdoor_band is not none and candidate_outdoor_band | int < outdoor_band | int else none }}
            outdoor_band: >-
              {{ candidate_outdoor_band | int
                 if outdoor_band is none or candidate_outdoor_band | int >= outdoor_band | int
                    or (warming_since is not none and as_timestamp(now()) - warming_since >= outdoor_warmup_seconds | float)
                 else outdoor_band | int }}
            warming_target: "{{ candidate_outdoor_band | int if candidate_outdoor_band | int < outdoor_band | int else none }}"
            effective_opening_limit: >-
              {{ [1, (sensor_opening_percentage | float * [1, 0.75, 0.5, 0.25][outdoor_band | int]) | round(0) | int] | max
                 if readings.outdoor_enabled else sensor_opening_percentage | float }}
            open_windows: >-
              {{ windows | select('is_state', 'open') | list
                 + windows | select('is_state', 'opening') | list }}
            automatic_windows: "{{ automatic_windows | select('in', open_windows) | list }}"
            cold_since: >-
              {% set ns = namespace(items=[]) %}
              {% if readings.temperature_valid and readings.temperature <= minimum_temperature | float %}
                {% for window in open_windows %}
                  {% set ns.items = ns.items + [(window, cold_since.get(window, as_timestamp(now())))] %}
                {% endfor %}
              {% endif %}
              {{ dict(ns.items) }}
            cold_close_windows: >-
              {% set ns = namespace(windows=[]) %}
              {% for window, started in cold_since.items() %}
                {% if as_timestamp(now()) - started >= cold_close_delay | float * 60 %}
                  {% set ns.windows = ns.windows + [window] %}
                {% endif %}
              {% endfor %}
              {{ ns.windows }}
            close_windows: >-
              {{ (cold_close_windows
                  + (automatic_windows if readings.air_valid and readings.recovered else []))
                 | unique | list }}

        # Only windows opened by this run are adjusted. The base above comes
        # exclusively from the blueprint input, never from a device reading.
        - if:
            - condition: template
              value_template: >-
                {{ readings.outdoor_enabled and sensor_opening_entity | length > 0
                   and outdoor_thresholds_valid and automatic_windows | count > 0
                   and close_windows | count == 0
                   and effective_opening_limit != last_applied_opening_limit }}
          then:
            - action: number.set_value
              target:
                entity_id: "{{ sensor_opening_entity }}"
              data:
                value: "{{ effective_opening_limit }}"
            - variables:
                last_applied_opening_limit: "{{ effective_opening_limit }}"
            - repeat:
                for_each: "{{ automatic_windows }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: "{{ repeat.item }}"
                  - action: logbook.log
                    continue_on_error: true
                    data:
                      name: "Проветривание · Opening limit"
                      entity_id: "{{ repeat.item }}"
                      message: >-
                        Лимит {{ effective_opening_limit }}% из базы blueprint
                        {{ sensor_opening_percentage }}%; температура у окна
                        {{ readings.outdoor_temperature if readings.outdoor_valid else 'недоступна' }} °C.
                  - delay:
                      seconds: 1

        - choose:
            - conditions:
                - condition: template
                  alias: "Воздух нормализовался или истекла задержка по холоду"
                  value_template: "{{ close_windows | count > 0 }}"
              sequence:
                - repeat:
                    for_each: "{{ close_windows }}"
                    sequence:
                      - action: logbook.log
                        continue_on_error: true
                        data:
                          name: "{{ state_attr(this.entity_id, 'friendly_name') or 'Проветривание' }}"
                          entity_id: "{{ repeat.item }}"
                          domain: cover
                          message: >-
                            Команда закрытия:
                            {% if repeat.item in cold_close_windows %}
                              температура {{ readings.temperature }} °C ≤ {{ minimum_temperature }} °C
                              в течение {{ cold_close_delay }} мин.
                            {% else %}
                              все выбранные показатели CO₂/TVOC снизились до порогов закрытия.
                            {% endif %}
                      - action: cover.close_cover
                        continue_on_error: true
                        target:
                          entity_id: "{{ repeat.item }}"
                      - delay:
                          seconds: 1
                - if:
                    - condition: template
                      value_template: "{{ close_windows | count == open_windows | count }}"
                  then:
                    - stop: "Проветривание завершено"

            - conditions:
                - condition: template
                  alias: "Воздух требует проветривания и комната прогрета"
                  value_template: >-
                    {{ readings.valid and readings.high and readings.temperature >= reopening_temperature | float
                       and (not readings.outdoor_enabled
                            or (sensor_opening_entity | length > 0 and outdoor_thresholds_valid))
                       and windows | select('is_state', 'closed') | list | count > 0 }}
              sequence:
                - variables:
                    closed_windows: "{{ windows | select('is_state', 'closed') | list }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ sensor_opening_entity | length > 0 }}"
                      sequence:
                        - action: number.set_value
                          target:
                            entity_id: "{{ sensor_opening_entity }}"
                          data:
                            value: "{{ effective_opening_limit }}"
                        - variables:
                            last_applied_opening_limit: "{{ effective_opening_limit }}"
                        - delay:
                            seconds: 1
                - repeat:
                    for_each: "{{ closed_windows }}"
                    sequence:
                      - action: logbook.log
                        continue_on_error: true
                        data:
                          name: "{{ state_attr(this.entity_id, 'friendly_name') or 'Проветривание' }}"
                          entity_id: "{{ repeat.item }}"
                          domain: cover
                          message: >-
                            Команда открытия: {{ readings.high_sources | join('; ') }}.
                            Температура {{ readings.temperature }} °C ≥ {{ reopening_temperature }} °C.
                      - variables:
                          automatic_windows: "{{ (automatic_windows + [repeat.item]) | unique | list }}"
                      - action: cover.open_cover
                        continue_on_error: true
                        target:
                          entity_id: "{{ repeat.item }}"
                      - delay:
                          seconds: 1

        - if:
            - condition: template
              value_template: >-
                {{ windows | select('is_state', 'open') | list | count == 0
                   and windows | select('is_state', 'opening') | list | count == 0 }}
          then:
            - stop: "Открытых окон нет"

        - wait_template: >-
            {{ observed_entities | map('states') | list != observed_states }}
          timeout:
            seconds: >-
              {% set ns = namespace(delays=[60]) %}
              {% for started in cold_since.values() %}
                {% set remaining = cold_close_delay | float * 60 - (as_timestamp(now()) - started) %}
                {% if remaining > 0 %}
                  {% set ns.delays = ns.delays + [remaining] %}
                {% endif %}
              {% endfor %}
              {{ [1, ns.delays | min] | max }}
          continue_on_timeout: true
