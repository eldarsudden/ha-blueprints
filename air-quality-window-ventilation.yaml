blueprint:
  name: "Air Quality Window Ventilation"
  description: >-
    Проветривает выбранные cover-окна по CO₂/TVOC, расписанию cron
    или обоим способам.

    По датчикам: открытие при высоких показаниях, закрытие или приоткрытие
    при нормализации. Холод закрывает окно с заданной задержкой,
    потеря показаний — сразу. Проветривание в холоде можно разрешить с паузой.

    Cron: открывает независимо от всех датчиков и полностью закрывает
    по окончании интервала. Часовой пояс — Home Assistant.
    Перезапуск сохраняет границы расписания, но сбрасывает задержку по холоду.

    Дополнительно: контактный датчик для подтверждения закрытия,
    повторные команды, уведомления и текстовый статус.
  domain: automation
  homeassistant:
    min_version: 2025.9.0

  input:
    mode_section:
      name: "Режим и расписание"
      icon: mdi:calendar-clock
      collapsed: false
      input:
        control_mode:
          name: "Режим проветривания"
          default: sensors
          selector:
            select:
              options:
                - label: "По датчикам"
                  value: sensors
                - label: "Периодически, независимо от всех датчиков"
                  value: periodic
                - label: "По датчикам и периодически"
                  value: combined
        periodic_schedule:
          name: "Расписание проветривания (cron)"
          description: >-
            Пять полей: минута (0–59), час (0–23), день месяца (1–31),
            месяц (1–12), день недели (0 или 7 = воскресенье, 1 = понедельник).
            Поддерживаются *, списки через запятую, диапазоны и шаг /.
            Можно использовать JAN–DEC и MON–SUN.
            Примеры: 0 */2 * * * — каждые два часа;
            */30 8-22 * * * — каждые полчаса с 08:00 до 22:30;
            0 9,18 * * 1-5 — в 09:00 и 18:00 по будням.
            Для режимов «Периодически» и «По датчикам и периодически».
          default: "0 */2 * * *"
          selector:
            text: {}
        periodic_open_duration:
          name: "Длительность открытого состояния"
          description: >-
            Для периодического и объединённого режимов. Отсчитывается от времени
            в cron: запуск в 09:00 на 5 минут означает закрытие в 09:05,
            в том числе после перезапуска HA. Пересекающиеся интервалы объединяются.
            После окончания интервала окно закрывается полностью. Показания
            CO₂, TVOC и температуры, включая недоступность датчиков, игнорируются.
          default: 5
          selector:
            number:
              min: 0.5
              max: 240
              step: 0.5
              unit_of_measurement: "мин"
              mode: box

    room_section:
      name: "Комната и окна"
      icon: mdi:window-open
      collapsed: false
      input:
        room_area:
          name: "Комната (Area)"
          description: >-
            Область для поиска комнатных датчиков температуры.
            Окна выбираются отдельно: управление всей областью не выполняется.
            В периодическом режиме можно оставить пустым.
          default: ""
          selector:
            area: {}
        window_entities:
          name: "Окна"
          description: "Только выбранные cover-сущности будут открываться и закрываться."
          selector:
            entity:
              multiple: true
              filter:
                - domain: cover
        air_recovered_position:
          name: "Положение окна при нормальном воздухе"
          description: >-
            Когда все выбранные CO₂/TVOC снижаются ниже порогов закрытия:
            0% = полностью закрыто, 10% = слегка открыто, 100% = полностью
            открыто. Положение поддерживается автоматически, в том числе
            после ручного закрытия. Увеличение открытия разрешено только
            при превышении температурного порога повторного открытия. При холоде или
            потере показаний окно закрывается полностью. Если привод
            не поддерживает управление положением или не сообщает его,
            выполняется полное закрытие. Сначала завершается текущее движение.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    opening_section:
      name: "Уровень открытия при проветривании"
      icon: mdi:window-shutter-open
      collapsed: false
      input:
        sensor_opening_entity:
          name: "Сущность открытия по датчикам (опционально)"
          description: >-
            Number-сущность привода выбранного окна или группы: получает
            процент командой number.set_value. Без выбора — полное открытие
            через cover. Закрытие всегда выполняется через выбранные cover.
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        sensor_opening_percentage:
          name: "Открытие по датчикам"
          description: "Процент для выбранной выше number-сущности."
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        periodic_opening_entity:
          name: "Сущность открытия по расписанию (опционально)"
          description: >-
            Number-сущность привода: получает процент командой number.set_value
            во время интервала cron. Без выбора — полное открытие через cover.
          default: ""
          selector:
            entity:
              filter:
                - domain: number
        periodic_opening_percentage:
          name: "Открытие по расписанию"
          description: "Процент для выбранной выше number-сущности."
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    co2_section:
      name: "CO₂"
      icon: mdi:molecule-co2
      collapsed: false
      input:
        co2_sensors:
          name: "Датчики CO₂ (опционально)"
          description: >-
            Можно выбрать один или несколько датчиков в ppm.
            Оставьте пустым, если используется только TVOC.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: carbon_dioxide
        co2_open_threshold:
          name: "CO₂: открыть при превышении значения"
          default: 1200
          selector:
            number:
              min: 0
              max: 10000
              step: 50
              unit_of_measurement: ppm
              mode: box
        co2_close_threshold:
          name: "CO₂: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 800
          selector:
            number:
              min: 0
              max: 10000
              step: 50
              unit_of_measurement: ppm
              mode: box

    tvoc_section:
      name: "TVOC"
      icon: mdi:air-filter
      collapsed: false
      input:
        tvoc_sensors:
          name: "Датчики TVOC (опционально)"
          description: >-
            Пороги задаются в тех же единицах, что и показания датчика.
            Не смешивайте ppb и µg/m³ в одном списке.
            Оставьте пустым, если используется только CO₂.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
        tvoc_open_threshold:
          name: "TVOC: открыть при превышении значения"
          default: 500
          selector:
            number:
              min: 0
              max: 100000
              step: 1
              mode: box
        tvoc_close_threshold:
          name: "TVOC: закрыть при снижении ниже значения"
          description: "Должен быть ниже порога открытия. Учитываются все выбранные датчики."
          default: 250
          selector:
            number:
              min: 0
              max: 100000
              step: 1
              mode: box

    temperature_section:
      name: "Температура комнаты"
      icon: mdi:home-thermometer
      collapsed: false
      input:
        temperature_sensors:
          name: "Датчики температуры (опционально)"
          description: >-
            Если список пуст, используются sensor-сущности с device_class
            temperature в выбранной Area. Из всех датчиков берётся самая
            низкая температура. Можно выбрать конкретные комнатные датчики,
            чтобы исключить неподходящие датчики из автоматического поиска.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: temperature
        temperature_close_threshold:
          name: "Закрыть окно при снижении температуры ниже значения"
          default: 20
          selector:
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        temperature_reopen_threshold:
          name: "Разрешить открытие при превышении заданной температуры"
          description: "Должен быть выше температурного порога закрытия."
          default: 22
          selector:
            number:
              min: 5
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        allow_cold_ventilation:
          name: "Начинать проветривание даже при низкой температуре"
          description: >-
            Разрешает открыть окно при высоком CO₂/TVOC, даже если температура
            ниже порога повторного открытия. После открытия проверка холода
            и задержка полного закрытия работают как обычно. При нулевой
            задержке холодное окно закроется сразу. Недоступные показания
            по-прежнему запрещают открытие. Приоткрытие при нормальном
            воздухе остаётся ограничено температурой. Новый цикл начинается
            только у закрытого окна после паузы; выбранный контактный датчик
            также должен подтверждать закрытие.
          default: false
          selector:
            boolean: {}
        cold_ventilation_pause:
          name: "Пауза между проветриваниями при низкой температуре"
          description: >-
            Используется, если включена опция выше. Минимальное время
            от перехода cover в состояние «закрыто» до нового открытия
            при высоком CO₂/TVOC и температуре ниже порога повторного открытия.
            Проверяется раз в минуту. При прогреве обычное проветривание
            разрешено без этой паузы. После перезапуска HA отсчёт может
            начаться заново.
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: "мин"
              mode: box
        temperature_close_delay:
          name: "Задержка закрытия при снижении температуры"
          description: >-
            Сколько минут температура должна оставаться ниже порога
            закрытия после снижения. Затем окно закроется даже при высоких
            CO₂ и TVOC. Прогрев выше порога отменяет закрытие по холоду.
            0 = закрыть сразу. Показания CO₂ и TVOC не сбрасывают отсчёт.
            Помощник таймера не нужен. После перезапуска HA или перезагрузки
            автоматизации задержка по холоду отсчитывается заново.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 0.5
              unit_of_measurement: "мин"
              mode: box

    verification_section:
      name: "Подтверждение закрытия (опционально)"
      icon: mdi:window-closed-variant
      collapsed: true
      input:
        window_contacts:
          name: "Контактные датчики окон"
          description: >-
            Добавьте пару и выберите окно и его контактный датчик из списков.
            Окно должно входить в выбранный выше список окон. Для каждого
            окна можно указать один отдельный датчик: off = закрыто,
            on = открыто. Если пары не добавлены, подтверждение закрытия
            и повторы команд отключены.
          default: []
          selector:
            object:
              multiple: true
              label_field: window
              description_field: sensor
              fields:
                window:
                  label: "Окно"
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: cover
                sensor:
                  label: "Контактный датчик"
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: binary_sensor
        close_confirmation_timeout:
          name: "Ожидание подтверждения закрытия"
          description: "Сколько ждать контактный датчик после каждой команды закрытия."
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 1
              unit_of_measurement: "сек"
              mode: box
        close_retry_count:
          name: "Повторы команды закрытия"
          description: >-
            Число дополнительных команд за одну проверку после первоначальной.
            0 = только дождаться датчика и сообщить о неудаче.
            При недоступном контактном датчике дополнительные команды не отправляются.
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 1
              mode: box

    reboot_section:
      name: "Повтор команды после Reboot"
      icon: mdi:restart-alert
      collapsed: true
      input:
        window_last_events:
          name: "Датчики Last event (опционально)"
          description: >-
            Выберите датчик последнего события привода. При одном окне поле
            «Окно» можно пропустить. Повторяется только команда, после которой
            появилось новое событие Reboot; остальные ошибки не запускают повторы.
            Одинаковые повторные события должны обновлять состояние датчика.
          default: []
          selector:
            object:
              multiple: true
              label_field: sensor
              description_field: window
              fields:
                window:
                  label: "Окно (необязательно для одного окна)"
                  required: false
                  selector:
                    entity:
                      filter:
                        - domain: cover
                sensor:
                  label: "Last event"
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: sensor
        reboot_detection_timeout:
          name: "Ожидание события Reboot после команды"
          default: 5
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: "сек"
              mode: box
        reboot_retry_delay:
          name: "Пауза после Reboot"
          description: >-
            Перед повтором выдерживает паузу и ждёт доступности привода
            ещё не более этого времени. Показания и расписание проверяются заново.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: "сек"
              mode: box
        reboot_retry_count:
          name: "Повторы после Reboot"
          description: "Дополнительные попытки для каждого окна за один запуск. 0 = выключено."
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 1
              mode: box

    diagnostics_section:
      name: "Статус и уведомления"
      icon: mdi:information-outline
      collapsed: true
      input:
        status_entity:
          name: "Текстовый помощник для статуса (опционально)"
          description: >-
            Создайте помощник «Текст» без ограничения шаблоном, с минимальной
            длиной 0 и максимальной 255, и выберите его здесь. Причина решения
            будет видна на панели. Без помощника она доступна в трассировке.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text
        enable_notifications:
          name: "Уведомления о проблемах в Home Assistant"
          description: >-
            Сообщает о длительно плохом воздухе при заблокированном открытии
            и о неподтверждённом закрытии. Для каждой проблемы обновляется
            одно уведомление; после устранения оно удаляется.
          default: true
          selector:
            boolean: {}
        blocked_air_notification_delay:
          name: "Плохой воздух при заблокированном открытии: уведомить через"
          description: >-
            CO₂ или TVOC должен всё это время оставаться высоким, все окна —
            закрытыми или недоступными, а открытие — невозможным из-за
            температуры, некорректных показаний или недоступности приводов.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: "мин"
              mode: box

# Расписание вычисляется по календарю, задержка по холоду выполняется внутри
# запуска. Параллельные события могут немедленно закрыть окно по показаниям.
mode: parallel
max: 50

# В trigger_variables только inputs: поиск датчиков происходит в шаблонах,
# чтобы их изменения отслеживались, а не фиксировались при загрузке.
trigger_variables:
  control_mode: !input control_mode
  periodic_open_duration: !input periodic_open_duration
  selected_area: !input room_area
  selected_temperature_sensors: !input temperature_sensors
  minimum_temperature: !input temperature_close_threshold
  reopening_temperature: !input temperature_reopen_threshold
  allow_cold_ventilation: !input allow_cold_ventilation
  co2_entities: !input co2_sensors
  tvoc_entities: !input tvoc_sensors
  co2_open: !input co2_open_threshold
  co2_close: !input co2_close_threshold
  tvoc_open: !input tvoc_open_threshold
  tvoc_close: !input tvoc_close_threshold
  windows: !input window_entities
  notifications_enabled: !input enable_notifications
  contact_pairs: !input window_contacts
  # Форма возвращает список пар. Старые сохранённые словари поддерживаются.
  # Некорректные или повторяющиеся пары не должны незаметно терять датчики.
  contacts: &normalize_contacts >-
    {% if contact_pairs is mapping %}
      {{ contact_pairs }}
    {% elif contact_pairs is sequence and contact_pairs is not string %}
      {% set ns = namespace(items=[], valid=true) %}
      {% for pair in contact_pairs %}
        {% if pair is not mapping or pair.get('window') is not string
           or pair.get('sensor') is not string %}
          {% set ns.valid = false %}
        {% else %}
          {% set ns.items = ns.items + [(pair.window, pair.sensor)] %}
        {% endif %}
      {% endfor %}
      {% set normalized = dict(ns.items) %}
      {{ normalized if ns.valid and normalized | count == contact_pairs | count else none }}
    {% else %}
      {{ none }}
    {% endif %}

triggers:
  # Запускаем действия при достижении порогов и потере/восстановлении
  # корректных показаний, а не на каждом изменении CO₂/TVOC на одну единицу.
  - trigger: template
    id: air_high
    alias: "Значение CO₂ или TVOC превысило порог открытия"
    value_template: >-
      {% set ns = namespace(valid=true, high=false, recovered=true, units=[]) %}
      {% for entity in co2_entities + tvoc_entities %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or value | float < 0 %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% if entity in co2_entities %}
            {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
            {% set ns.high = ns.high or value >= co2_open | float %}
            {% set ns.recovered = ns.recovered and value <= co2_close | float %}
          {% endif %}
          {% if entity in tvoc_entities %}
            {% set ns.units = ns.units + [unit] %}
            {% set ns.high = ns.high or value >= tvoc_open | float %}
            {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set valid = ns.valid and co2_entities | count + tvoc_entities | count > 0
         and ns.units | unique | list | count <= 1 %}
      {{ control_mode != 'periodic' and valid and ns.high }}
  - trigger: template
    id: air_recovered
    alias: "Все показатели воздуха снизились ниже порогов закрытия"
    value_template: &air_recovered_condition >-
      {% set ns = namespace(valid=true, high=false, recovered=true, units=[]) %}
      {% for entity in co2_entities + tvoc_entities %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or value | float < 0 %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% if entity in co2_entities %}
            {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
            {% set ns.high = ns.high or value >= co2_open | float %}
            {% set ns.recovered = ns.recovered and value <= co2_close | float %}
          {% endif %}
          {% if entity in tvoc_entities %}
            {% set ns.units = ns.units + [unit] %}
            {% set ns.high = ns.high or value >= tvoc_open | float %}
            {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set valid = ns.valid and co2_entities | count + tvoc_entities | count > 0
         and ns.units | unique | list | count <= 1 %}
      {{ control_mode != 'periodic' and valid and ns.recovered }}
  - trigger: template
    id: air_unavailable
    alias: "Показания датчиков воздуха некорректны"
    value_template: &air_unavailable_condition >-
      {% set ns = namespace(valid=true, high=false, recovered=true, units=[]) %}
      {% for entity in co2_entities + tvoc_entities %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or value | float < 0 %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% if entity in co2_entities %}
            {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
            {% set ns.high = ns.high or value >= co2_open | float %}
            {% set ns.recovered = ns.recovered and value <= co2_close | float %}
          {% endif %}
          {% if entity in tvoc_entities %}
            {% set ns.units = ns.units + [unit] %}
            {% set ns.high = ns.high or value >= tvoc_open | float %}
            {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set valid = ns.valid and co2_entities | count + tvoc_entities | count > 0
         and ns.units | unique | list | count <= 1 %}
      {{ control_mode != 'periodic' and not valid }}
  - trigger: template
    id: air_intermediate
    alias: "Корректные показания воздуха между порогами"
    value_template: >-
      {% set ns = namespace(valid=true, high=false, recovered=true, units=[]) %}
      {% for entity in co2_entities + tvoc_entities %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or value | float < 0 %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% if entity in co2_entities %}
            {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
            {% set ns.high = ns.high or value >= co2_open | float %}
            {% set ns.recovered = ns.recovered and value <= co2_close | float %}
          {% endif %}
          {% if entity in tvoc_entities %}
            {% set ns.units = ns.units + [unit] %}
            {% set ns.high = ns.high or value >= tvoc_open | float %}
            {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set valid = ns.valid and co2_entities | count + tvoc_entities | count > 0
         and ns.units | unique | list | count <= 1 %}
      {{ control_mode != 'periodic' and valid and not ns.high and not ns.recovered }}
  # to: null игнорирует изменения атрибутов, в частности last_seen,
  # linkquality и current_position при движении окна.
  - trigger: state
    entity_id: !input temperature_sensors
    enabled: "{{ control_mode != 'periodic' }}"
    to: null
    id: temperature_changed
  - trigger: state
    entity_id: !input window_entities
    to: null
    id: window_changed
  # Автоматически найденные датчики нельзя подставить в статический state
  # trigger. Шаблоны следят за холодом/потерей показаний и прогревом комнаты.
  - trigger: template
    id: room_cold_or_unavailable
    value_template: >-
      {% set ns = namespace(values=[], valid=true) %}
      {% set sensors = selected_temperature_sensors %}
      {% if sensors | count == 0 %}
        {% set sensors = area_entities(selected_area)
           | select('match', '^sensor[.]')
           | select('is_state_attr', 'device_class', 'temperature') | list %}
      {% endif %}
      {% for entity in sensors %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
             else value - 273.15 if unit == 'K' else value %}
          {% set ns.values = ns.values + [celsius | round(3)] %}
        {% endif %}
      {% endfor %}
      {{ control_mode != 'periodic' and (not ns.valid or ns.values | count == 0
         or ns.values | min <= minimum_temperature | float) }}
  - trigger: template
    id: room_warmed_up
    value_template: >-
      {% set ns = namespace(values=[], valid=true) %}
      {% set sensors = selected_temperature_sensors %}
      {% if sensors | count == 0 %}
        {% set sensors = area_entities(selected_area)
           | select('match', '^sensor[.]')
           | select('is_state_attr', 'device_class', 'temperature') | list %}
      {% endif %}
      {% for entity in sensors %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
             else value - 273.15 if unit == 'K' else value %}
          {% set ns.values = ns.values + [celsius | round(3)] %}
        {% endif %}
      {% endfor %}
      {{ control_mode != 'periodic' and ns.valid and ns.values | count > 0
         and ns.values | min >= reopening_temperature | float }}
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: template
    id: air_blocked
    value_template: &air_blocked_condition >-
      {% set ns = namespace(high=false, valid=true, temperatures=[], units=[]) %}
      {% for entity in co2_entities + tvoc_entities %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or value | float < 0 %}
          {% set ns.valid = false %}
        {% else %}
          {% if entity in co2_entities %}
            {% if unit != 'ppm' %}
              {% set ns.valid = false %}
            {% else %}
              {% set ns.high = ns.high or value | float >= co2_open | float %}
            {% endif %}
          {% endif %}
          {% if entity in tvoc_entities %}
            {% set ns.units = ns.units + [unit] %}
            {% set ns.high = ns.high or value | float >= tvoc_open | float %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set sensors = selected_temperature_sensors %}
      {% if sensors | count == 0 %}
        {% set sensors = area_entities(selected_area)
           | select('match', '^sensor[.]')
           | select('is_state_attr', 'device_class', 'temperature') | list %}
      {% endif %}
      {% for entity in sensors %}
        {% set value = states(entity) %}
        {% set unit = state_attr(entity, 'unit_of_measurement') %}
        {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
          {% set ns.valid = false %}
        {% else %}
          {% set value = value | float %}
          {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
             else value - 273.15 if unit == 'K' else value %}
          {% set ns.temperatures = ns.temperatures + [celsius | round(3)] %}
        {% endif %}
      {% endfor %}
      {% set no_open_windows = windows | select('is_state', 'open') | list | count == 0
         and windows | select('is_state', 'opening') | list | count == 0
         and (contacts is not mapping or contacts.values() | select('is_state', 'on') | list | count == 0) %}
      {% set no_available_windows = windows | select('is_state', 'closed') | list | count == 0
         and windows | select('is_state', 'closing') | list | count == 0 %}
      {% set blocked = control_mode != 'periodic' and notifications_enabled and ns.high and no_open_windows
         and (not ns.valid or ns.temperatures | count == 0
              or ns.units | unique | list | count > 1
              or no_available_windows
              or (not allow_cold_ventilation
                  and ns.temperatures | min < reopening_temperature | float)) %}
      {{ blocked != (invert_blocked_check | default(false)) }}
  - trigger: time_pattern
    minutes: "/1"
    id: periodic_check
  - trigger: time_pattern
    seconds: "30"
    enabled: "{{ control_mode != 'sensors' and periodic_open_duration | float % 1 != 0 }}"
    id: schedule_check

# Используем choose для совместимости с просмотром трассировок HA:
# https://github.com/home-assistant/frontend/pull/54910
actions:
  - variables:
      control_mode: !input control_mode
      periodic_schedule: !input periodic_schedule
      periodic_open_duration: !input periodic_open_duration
      sensor_opening_entity: !input sensor_opening_entity
      sensor_opening_percentage: !input sensor_opening_percentage
      periodic_opening_entity: !input periodic_opening_entity
      periodic_opening_percentage: !input periodic_opening_percentage
      selected_area: !input room_area
      windows: !input window_entities
      co2_entities: !input co2_sensors
      tvoc_entities: !input tvoc_sensors
      selected_temperature_sensors: !input temperature_sensors
      co2_open: !input co2_open_threshold
      co2_close: !input co2_close_threshold
      tvoc_open: !input tvoc_open_threshold
      tvoc_close: !input tvoc_close_threshold
      minimum_temperature: !input temperature_close_threshold
      reopening_temperature: !input temperature_reopen_threshold
      allow_cold_ventilation: !input allow_cold_ventilation
      cold_ventilation_pause: !input cold_ventilation_pause
      cold_close_delay: !input temperature_close_delay
      normal_position: !input air_recovered_position
      contact_pairs: !input window_contacts
      contacts: *normalize_contacts
      last_event_pairs: !input window_last_events
      reboot_watch: !input reboot_detection_timeout
      reboot_delay: !input reboot_retry_delay
      reboot_retries: !input reboot_retry_count
      event_sensors: >-
        {% set ns = namespace(items=[], valid=last_event_pairs is sequence and last_event_pairs is not string) %}
        {% if ns.valid %}
          {% for pair in last_event_pairs %}
            {% if pair is not mapping %}
              {% set ns.valid = false %}
            {% else %}
              {% set window = pair.get('window') or (windows[0] if windows | count == 1 else '') %}
              {% set sensor = pair.get('sensor') %}
              {% if window not in windows or sensor is not string or not sensor.startswith('sensor.') %}
                {% set ns.valid = false %}
              {% else %}
                {% set ns.items = ns.items + [(window, sensor)] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set mapped = dict(ns.items) %}
        {{ mapped if ns.valid and mapped | count == ns.items | count else none }}
      confirmation_timeout: !input close_confirmation_timeout
      retry_count: !input close_retry_count
      status_entity: !input status_entity
      notifications_enabled: !input enable_notifications
      blocked_air_delay: !input blocked_air_notification_delay
      invert_blocked_check: false
      cold_opened_windows: []
      cold_wait_expired: {}
      closing_cycles: {}
      scheduled_close_windows: []
      opening_commands_sent: []
      reboot_commands: []
      reboot_processed: 0
      reboot_attempts: {}
      reboot_recovery_in_progress: false
      notification_prefix: "air_ventilation_{{ this.entity_id | replace('.', '_') }}"

  - variables:
      cron_spec: >-
        {% set fields = periodic_schedule.split() if periodic_schedule is string else [] %}
        {% set ns = namespace(valid=fields | count == 5, rows=[]) %}
        {% set bounds = [(0, 59), (0, 23), (1, 31), (1, 12), (0, 7)] %}
        {% if ns.valid %}
          {% for index in range(5) %}
            {% set field = namespace(text=fields[index] | lower, values=[]) %}
            {% if index == 3 %}
              {% for name in ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'] %}
                {% set field.text = field.text | replace(name, loop.index | string) %}
              {% endfor %}
            {% elif index == 4 %}
              {% for name in ['sun','mon','tue','wed','thu','fri','sat'] %}
                {% set field.text = field.text | replace(name, loop.index0 | string) %}
              {% endfor %}
            {% endif %}
            {% set low, high = bounds[index] %}
            {% for part in field.text.split(',') %}
              {% set pieces = part.split('/') %}
              {% set base = pieces[0] %}
              {% set step = pieces[1] | int(0) if pieces | count == 2 else 1 %}
              {% set row = namespace(valid=pieces | count <= 2 and step > 0,
                                     start=low, stop=high) %}
              {% if pieces | count == 2 and pieces[1] is not match('^[0-9]+$') %}
                {% set row.valid = false %}
              {% endif %}
              {% if base != '*' %}
                {% set limits = base.split('-') %}
                {% if limits | count > 2 or limits[0] is not match('^[0-9]+$')
                   or (limits | count == 2 and limits[1] is not match('^[0-9]+$')) %}
                  {% set row.valid = false %}
                {% else %}
                  {% set row.start = limits[0] | int %}
                  {% set row.stop = limits[1] | int if limits | count == 2
                     else high if pieces | count == 2 else row.start %}
                {% endif %}
              {% endif %}
              {% if not row.valid or not low <= row.start <= row.stop <= high %}
                {% set ns.valid = false %}
              {% else %}
                {% for value in range(row.start, row.stop + 1, step) %}
                  {% set field.values = field.values + [0 if index == 4 and value == 7 else value] %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% set ns.rows = ns.rows + [field.values | unique | list | sort] %}
          {% endfor %}
        {% endif %}
        {{ dict(valid=ns.valid, fields=ns.rows,
                day_any=fields | count == 5 and '*' in fields[2],
                weekday_any=fields | count == 5 and '*' in fields[4]) }}

  - variables:
      configuration_valid: >-
        {% set ns = namespace(valid=contacts is mapping and event_sensors is mapping
           and is_number(reboot_watch) and 1 <= reboot_watch | float <= 60
           and is_number(reboot_delay) and 1 <= reboot_delay | float <= 120
           and is_number(reboot_retries) and 0 <= reboot_retries | float <= 5
           and reboot_retries | float == reboot_retries | int
           and control_mode in ['sensors', 'periodic', 'combined']) %}
        {% set outputs = ([(sensor_opening_entity, sensor_opening_percentage)] if control_mode != 'periodic' else [])
           + ([(periodic_opening_entity, periodic_opening_percentage)] if control_mode != 'sensors' else []) %}
        {% for entity, percentage in outputs %}
          {% if entity is not string or (entity | length > 0
             and (not entity.startswith('number.') or not is_number(percentage)
                  or not 1 <= percentage | float <= 100
                  or percentage | float != percentage | int)) %}
            {% set ns.valid = false %}
          {% endif %}
        {% endfor %}
        {% if contacts is mapping %}
          {% for window, sensor in contacts.items() %}
            {% if window not in windows or sensor is not string
               or not sensor.startswith('binary_sensor.') %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
          {% if ns.valid and contacts.values() | list | unique | list | count != contacts | count %}
            {% set ns.valid = false %}
          {% endif %}
        {% endif %}
        {{ ns.valid and windows | count > 0
         and (control_mode == 'periodic' or (
              co2_entities | count + tvoc_entities | count > 0
              and (co2_entities | count == 0 or co2_open | float > co2_close | float)
              and (tvoc_entities | count == 0 or tvoc_open | float > tvoc_close | float)
              and is_number(normal_position) and 0 <= normal_position | float <= 100
              and normal_position | float == normal_position | int
              and is_number(cold_ventilation_pause) and 1 <= cold_ventilation_pause | float <= 1440
              and reopening_temperature | float > minimum_temperature | float))
         and (control_mode == 'sensors' or (
              cron_spec.valid and is_number(periodic_open_duration)
              and 0.5 <= periodic_open_duration | float <= 240
              and periodic_open_duration | float * 2 == (periodic_open_duration | float * 2) | int)) }}

  - alias: "Сообщить об ошибке настроек"
    choose:
      - conditions:
          - condition: template
            alias: "Настройки некорректны"
            value_template: "{{ not configuration_valid }}"
        sequence:
          - variables:
              ventilation_status: "Ошибка настроек: проверьте режим, датчики, приводы, пороги и расписание cron"
          - &publish_status
            alias: "Обновить текстовый статус"
            choose:
              - conditions:
                  - condition: template
                    alias: "Помощник статуса доступен и текст изменился"
                    value_template: >-
                      {{ status_entity | length > 0 and states(status_entity) not in ['unknown', 'unavailable']
                         and states(status_entity) != ventilation_status[:state_attr(status_entity, 'max') | int(255)] }}
                sequence:
                  - action: input_text.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ status_entity }}"
                    data:
                      value: "{{ ventilation_status[:state_attr(status_entity, 'max') | int(255)] }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notifications_enabled }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_prefix }}_configuration"
                      title: "Проветривание: ошибка настроек"
                      message: >-
                        {{ ventilation_status }}. Cron должен содержать ровно пять
                        полей: минута, час, день месяца, месяц, день недели.
                        Пример: 0 */2 * * *. Длительность — от 0,5 до 240 минут
                        с шагом 0,5 минуты. Помощники таймеров не используются.

  - condition: template
    alias: "Выбраны датчики и заданы корректные пороги и контакты"
    value_template: "{{ configuration_valid }}"

  - condition: template
    alias: "Возвращение привода в сеть обрабатывает ожидающий запуск"
    value_template: >-
      {% set sensor = event_sensors.get(trigger.entity_id | default(''), '') if trigger is defined else '' %}
      {{ not (reboot_retries | int > 0 and sensor | length > 0 and trigger is defined
           and trigger.id | default('') == 'window_changed'
           and trigger.from_state is defined and trigger.from_state is not none
           and trigger.from_state.state in ['unknown', 'unavailable']
           and states(sensor) | lower == 'reboot'
           and as_timestamp(now()) - as_timestamp(states[sensor].last_changed, 0) < reboot_delay | float * 2 + reboot_watch | float + 5
           and state_attr(this.entity_id, 'current') | int(0) > 1) }}

  # Ищем последнее совпадение cron в пределах длительности и одного шага
  # проверки. Состояние интервала восстанавливается из календаря без хранения.
  - &refresh_schedule
    variables:
      schedule_state: >-
        {% set ns = namespace(start=none) %}
        {% set current = now() %}
        {% set duration = periodic_open_duration | float(0) * 60 %}
        {% if control_mode != 'sensors' and cron_spec.valid and 30 <= duration <= 14400 %}
          {% set minute = current.replace(second=0, microsecond=0) %}
          {% for offset in range((duration / 60) | round(0, 'ceil') | int + 2) %}
            {% if ns.start is none %}
              {% set candidate = as_local(as_datetime(as_timestamp(minute) - offset * 60)) %}
              {% set day_match = candidate.day in cron_spec.fields[2] %}
              {% set weekday_match = (candidate.weekday() + 1) % 7 in cron_spec.fields[4] %}
              {% set date_match = day_match and weekday_match
                 if cron_spec.day_any or cron_spec.weekday_any else day_match or weekday_match %}
              {% if candidate.minute in cron_spec.fields[0]
                 and candidate.hour in cron_spec.fields[1]
                 and candidate.month in cron_spec.fields[3] and date_match %}
                {% set ns.start = as_timestamp(candidate) %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set elapsed = as_timestamp(current) - ns.start if ns.start is not none else none %}
        {{ dict(active=elapsed is not none and 0 <= elapsed < duration,
                closing_due=elapsed is not none and 0 <= elapsed - duration < 30,
                started_at=ns.start, ends_at=ns.start + duration if ns.start is not none else none) }}
      opening_entity: >-
        {{ periodic_opening_entity if control_mode == 'periodic' or schedule_state.active
           else sensor_opening_entity }}
      opening_percentage: >-
        {{ (periodic_opening_percentage if control_mode == 'periodic' or schedule_state.active
            else sensor_opening_percentage) | int }}
      opening_command_available: >-
        {{ opening_entity | length == 0
           or (is_number(states(opening_entity))
               and state_attr(opening_entity, 'min') | float(0) <= opening_percentage
               and opening_percentage <= state_attr(opening_entity, 'max') | float(100)) }}
      opening_level_matches: >-
        {{ opening_entity | length > 0 and is_number(states(opening_entity))
           and states(opening_entity) | float == opening_percentage }}

  - &refresh_temperature_entities
    variables:
      temperature_entities: >-
        {{ selected_temperature_sensors if selected_temperature_sensors | count > 0
           else area_entities(selected_area)
           | select('match', '^sensor[.]')
           | select('is_state_attr', 'device_class', 'temperature') | list }}

  - &refresh_readings
    variables:
      readings: >-
        {% set ns = namespace(valid=true, high=false, high_co2=false, high_tvoc=false, recovered=true,
           temperatures=[], tvoc_units=[]) %}
        {% for entity in co2_entities + tvoc_entities %}
          {% set value = states(entity) %}
          {% set unit = state_attr(entity, 'unit_of_measurement') %}
          {% if not is_number(value) %}
            {% set ns.valid = false %}
          {% elif value | float < 0 %}
            {% set ns.valid = false %}
          {% else %}
            {% set value = value | float %}
            {% if entity in co2_entities %}
              {% if unit != 'ppm' %}{% set ns.valid = false %}{% endif %}
              {% set ns.high = ns.high or value >= co2_open | float %}
              {% set ns.high_co2 = ns.high_co2 or value >= co2_open | float %}
              {% set ns.recovered = ns.recovered and value <= co2_close | float %}
            {% endif %}
            {% if entity in tvoc_entities %}
              {% set ns.tvoc_units = ns.tvoc_units + [unit] %}
              {% set ns.high = ns.high or value >= tvoc_open | float %}
              {% set ns.high_tvoc = ns.high_tvoc or value >= tvoc_open | float %}
              {% set ns.recovered = ns.recovered and value <= tvoc_close | float %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% for entity in temperature_entities %}
          {% set value = states(entity) %}
          {% set unit = state_attr(entity, 'unit_of_measurement') %}
          {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
            {% set ns.valid = false %}
          {% else %}
            {% set value = value | float %}
            {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
               else value - 273.15 if unit == 'K' else value %}
            {% set ns.temperatures = ns.temperatures + [celsius | round(3)] %}
          {% endif %}
        {% endfor %}
        {{ dict(valid=ns.valid and ns.temperatures | count > 0
             and ns.tvoc_units | unique | list | count <= 1,
           high=ns.high, high_co2=ns.high_co2, high_tvoc=ns.high_tvoc, recovered=ns.recovered,
           temperature=ns.temperatures | min if ns.temperatures | count > 0 else none) }}

  - &refresh_decision
    variables:
      window_action: >-
        {% if control_mode == 'periodic' %}
          hold
        {% elif not readings.valid %}
          close
        {% elif readings.recovered %}
          {{ 'position' if normal_position | int > 0
             and readings.temperature > minimum_temperature | float else 'close' }}
        {% elif readings.temperature <= minimum_temperature | float %}
          {{ 'close_cold' if cold_close_delay | float > 0 else 'close' }}
        {% elif readings.high and readings.temperature >= reopening_temperature | float %}
          open
        {% else %}
          hold
        {% endif %}
      ventilation_status: >-
        {% set unconfirmed = namespace(found=false) %}
        {% for window, sensor in contacts.items() %}
          {% if not is_state(sensor, 'off') %}
            {% set unconfirmed.found = true %}
          {% endif %}
        {% endfor %}
        {% if not opening_command_available and (schedule_state.active
           or (control_mode != 'periodic' and readings.valid and readings.high and not readings.recovered
               and (readings.temperature >= reopening_temperature | float or allow_cold_ventilation))) %}
          Открытие недоступно: проверьте {{ opening_entity }} и допустимость {{ opening_percentage }}%
        {% elif schedule_state.active %}
          Проветривание по расписанию {{ periodic_schedule }}: {{ periodic_open_duration }} мин независимо от датчиков
        {% elif control_mode == 'periodic' %}
          Ожидание расписания {{ periodic_schedule }}
        {% elif status_entity | length > 0
           and states(status_entity).startswith('Закрытие не подтверждено:')
           and unconfirmed.found and window_action in ['close', 'close_cold'] %}
          Закрытие не подтверждено: проверьте окно и контактный датчик
        {% elif not readings.valid %}
          Закрытие: нет корректных показаний датчиков
        {% elif readings.recovered %}
          {% if window_action == 'position' %}
            {% set ns = namespace(fallback=false) %}
            {% for window in windows %}
              {% set position = state_attr(window, 'current_position') %}
              {% if state_attr(window, 'supported_features') | int(0) | bitwise_and(4) == 0
                 or not is_number(position) or not 0 <= position | float <= 100 %}
                {% set ns.fallback = true %}
              {% endif %}
            {% endfor %}
            Воздух в норме: целевое открытие {{ normal_position | int }}%;
            увеличение открытия разрешено от {{ reopening_temperature }} °C
            {{ '; окна без управления положением закрываются полностью' if ns.fallback else '' }}
          {% else %}
            Закрытие: качество воздуха восстановлено
          {% endif %}
        {% elif readings.temperature <= minimum_temperature | float %}
          {% if windows | select('is_state', 'open') | list | count == 0
             and windows | select('is_state', 'opening') | list | count == 0
             and contacts.values() | select('is_state', 'on') | list | count == 0 %}
            {% if allow_cold_ventilation and readings.high %}
              Пауза между проветриваниями: {{ cold_ventilation_pause }} мин после закрытия
            {% else %}
              Открытие запрещено: в комнате холодно
            {% endif %}
          {% elif cold_close_delay | float > 0 %}
            Ожидание закрытия по холоду: {{ cold_close_delay }} мин
          {% else %}
            Закрытие: низкая температура
          {% endif %}
        {% elif readings.high and readings.temperature < reopening_temperature | float %}
          {% if allow_cold_ventilation %}
            {% if windows | select('is_state', 'open') | list | count > 0
               or windows | select('is_state', 'opening') | list | count > 0
               or contacts.values() | select('is_state', 'on') | list | count > 0 %}
              Проветривание: CO₂/TVOC выше порога
            {% else %}
              Пауза между проветриваниями: {{ cold_ventilation_pause }} мин после закрытия
            {% endif %}
          {% else %}
            Открытие запрещено: ожидание прогрева комнаты
          {% endif %}
        {% elif readings.high %}
          {% if windows | select('is_state', 'closed') | list | count == 0
             and windows | select('is_state', 'closing') | list | count == 0
             and windows | select('is_state', 'open') | list | count == 0
             and windows | select('is_state', 'opening') | list | count == 0 %}
            Открытие недоступно: приводы окон не отвечают
          {% else %}
            Проветривание: {{ 'CO₂ и TVOC' if readings.high_co2 and readings.high_tvoc
               else 'CO₂' if readings.high_co2 else 'TVOC' }} выше порога
          {% endif %}
        {% else %}
          Сохранение положения: показатели между порогами
        {% endif %}

  - *publish_status

  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: "{{ notification_prefix }}_configuration"

  # Отдельный проход отправляет команды открытия до возможного ожидания
  # закрытия по холоду. Повторные события окна и датчиков не обходят паузу.
  # last_changed меняется при смене состояния, но не при смене атрибутов.
  - alias: "Начать новое проветривание без ожидания прогрева"
    choose:
      - conditions:
          - condition: template
            alias: "Проветривание при низкой температуре разрешено и воздух требует его"
            value_template: >-
              {{ control_mode != 'periodic' and not schedule_state.active
                 and allow_cold_ventilation and readings.valid and readings.high
                 and readings.temperature < reopening_temperature | float }}
        sequence:
          - repeat:
              for_each: "{{ windows | unique | list }}"
              sequence:
                - variables:
                    current_window: "{{ repeat.item }}"
                    contact_sensor: "{{ contacts.get(repeat.item, '') }}"
                - *refresh_temperature_entities
                - *refresh_readings
                - *refresh_schedule
                - choose:
                    - conditions:
                        - condition: template
                          alias: "Окно закрыто, пауза прошла и показания разрешают проветривание"
                          value_template: >-
                            {{ not schedule_state.active and opening_command_available
                               and readings.valid and readings.high and not readings.recovered
                               and readings.temperature < reopening_temperature | float
                               and is_state(current_window, 'closed')
                               and (contact_sensor | length == 0 or is_state(contact_sensor, 'off'))
                               and as_timestamp(now())
                                   - as_timestamp(states[current_window].last_changed, as_timestamp(now()))
                                   >= cold_ventilation_pause | float * 60 }}
                      sequence:
                        - variables:
                            cold_opened_windows: "{{ cold_opened_windows + [current_window] }}"
                        - &open_ventilation_window
                          choose:
                            - conditions:
                                - condition: template
                                  alias: "Открыть через number-сущность привода"
                                  value_template: >-
                                    {{ opening_entity | length > 0 and opening_command_available
                                       and [opening_entity, opening_percentage] not in opening_commands_sent }}
                              sequence:
                                - variables:
                                    motor_command: "{{ dict(service='number.set_value', entity=opening_entity, data=dict(value=opening_percentage), kind='open') }}"
                                - &prepare_motor_command
                                  variables:
                                    command_event_sensor: >-
                                      {% set sensors = event_sensors.values() | unique | list %}
                                      {{ event_sensors.get(current_window, '')
                                         or (sensors[0] if motor_command.service == 'number.set_value'
                                             and sensors | count == 1 else '') }}
                                    command_started_at: "{{ as_timestamp(now()) }}"
                                    command_report_before: >-
                                      {% set sensor = command_event_sensor %}
                                      {{ as_timestamp(states[sensor].last_changed, 0)
                                         if sensor | length > 0 and states(sensor) != 'unknown' else 0 }}
                                - action: number.set_value
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ opening_entity }}"
                                  data:
                                    value: "{{ opening_percentage }}"
                                - &remember_motor_command
                                  variables:
                                    reboot_commands: >-
                                      {% set sensor = command_event_sensor %}
                                      {{ reboot_commands + [dict(motor_command, window=current_window, sensor=sensor,
                                           sent_at=command_started_at, report_before=command_report_before,
                                           phase='periodic' if schedule_state.active else 'sensors',
                                           schedule_start=schedule_state.started_at,
                                           schedule_close=periodic_close_due | default(false),
                                           cold_expired=current_window in cold_wait_expired)]
                                         if sensor | length > 0 and reboot_retries | int > 0 else reboot_commands }}
                                - variables:
                                    opening_commands_sent: "{{ opening_commands_sent + [[opening_entity, opening_percentage]] }}"
                            - conditions:
                                - condition: template
                                  alias: "Открыть через cover без отдельной number-сущности"
                                  value_template: "{{ opening_entity | length == 0 }}"
                              sequence:
                                - variables:
                                    motor_command: "{{ dict(service='cover.open_cover', entity=current_window, data={}, kind='open') }}"
                                - *prepare_motor_command
                                - action: cover.open_cover
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ current_window }}"
                                - *remember_motor_command
          - *refresh_temperature_entities
          - *refresh_readings
          - *refresh_schedule
          - *refresh_decision
          - *publish_status

  # Один монитор на начало блокировки; startup и пятиминутные проверки
  # восстанавливают отсчёт после reload, если условие уже было истинным.
  # CO₂/TVOC могут обновляться, не перезапуская ожидание.
  - alias: "Дождаться длительной блокировки проветривания"
    choose:
      - conditions:
          - condition: template
            alias: "Расписание не требует открытия независимо от датчиков"
            value_template: "{{ not schedule_state.active }}"
          - condition: template
            alias: "Воздух требует проветривания, но открытие заблокировано"
            value_template: *air_blocked_condition
          - condition: template
            alias: "Событие разрешает запуск таймера уведомления"
            value_template: >-
              {{ trigger is not defined
                 or trigger.id | default('') in ['air_blocked', 'startup']
                 or (trigger.id | default('') == 'periodic_check' and now().minute % 5 == 0) }}
        sequence:
          - variables:
              invert_blocked_check: true
          - wait_template: *air_blocked_condition
            timeout:
              minutes: "{{ blocked_air_delay | float }}"
            continue_on_timeout: true
          - variables:
              blocked_wait_completed: "{{ wait.completed }}"
              invert_blocked_check: false
          - *refresh_temperature_entities
          - *refresh_readings
          - *refresh_schedule
          - *refresh_decision
          - *publish_status
          - alias: "Уведомить о длительной блокировке проветривания"
            choose:
              - conditions:
                  - condition: template
                    alias: "Время ожидания уведомления истекло"
                    value_template: "{{ not blocked_wait_completed }}"
                  - condition: template
                    alias: "Проветривание всё ещё заблокировано"
                    value_template: *air_blocked_condition
                sequence:
                  - action: persistent_notification.create
                    continue_on_error: true
                    data:
                      notification_id: "{{ notification_prefix }}_blocked"
                      title: "Проветривание: открытие заблокировано"
                      message: >-
                        {{ area_name(selected_area) }}: CO₂ или TVOC остаётся высоким
                        не менее {{ blocked_air_delay }} мин, а окна не открываются.
                        {{ ventilation_status }}.
          - stop: "Завершено наблюдение за заблокированным проветриванием"

  - alias: "Удалить уведомление после снятия блокировки"
    choose:
      - conditions:
          - condition: template
            alias: "Блокировка сохраняется — оставить уведомление"
            value_template: *air_blocked_condition
        sequence: []
    default:
      - action: persistent_notification.dismiss
        continue_on_error: true
        data:
          notification_id: "{{ notification_prefix }}_blocked"

  - variables:
      closing_requests: []

  # Только явный список cover; Area используется исключительно для датчиков.
  # Контакт on имеет приоритет над оптимистичным состоянием cover closed.
  # Без контакта уже закрытые/закрывающиеся окна повторно не трогаем.
  # События closed/closing от команды приводу не запускают новый цикл
  # подтверждения: контакт уже проверяется после первоначальной команды.
  # Остальные события и периодическая проверка сохраняют повторные попытки.
  - repeat:
      for_each: "{{ windows | unique | list }}"
      sequence:
        - variables:
            current_window: "{{ repeat.item }}"
            contact_sensor: "{{ contacts.get(repeat.item, '') }}"
        # Другой запуск мог отреагировать на прогрев или потерю показаний,
        # пока выполнялась команда предыдущему окну.
        - *refresh_temperature_entities
        - *refresh_readings
        - *refresh_schedule
        - &refresh_window_requirements
          variables:
            periodic_active: "{{ schedule_state.active }}"
            periodic_close_due: >-
              {{ control_mode != 'sensors' and not periodic_active
                 and (control_mode == 'periodic'
                      or ((verification_in_progress | default(false) or reboot_recovery_in_progress)
                          and current_window in scheduled_close_windows)
                      or (schedule_state.closing_due and trigger is defined
                          and trigger.id | default('') in ['periodic_check', 'schedule_check']))
                 and not (verification_in_progress | default(false) and not reboot_recovery_in_progress
                          and current_window in closing_cycles
                          and states(current_window) in ['open', 'opening']
                          and as_timestamp(states[current_window].last_changed, 0) != closing_cycles[current_window]) }}
            current_position: "{{ state_attr(current_window, 'current_position') }}"
            position_available: >-
              {{ state_attr(current_window, 'supported_features') | int(0) | bitwise_and(4) != 0
                 and is_number(current_position) and 0 <= current_position | float <= 100 }}
            full_close_required: >-
              {{ not periodic_active and (periodic_close_due
                 or (control_mode != 'periodic' and (
                      not readings.valid
                      or (readings.recovered and (normal_position | int == 0 or not position_available
                          or readings.temperature <= minimum_temperature | float))
                      or (readings.temperature <= minimum_temperature | float
                          and (cold_close_delay | float == 0
                               or (current_window in cold_wait_expired
                                   and (reboot_recovery_in_progress or states(current_window) in ['closed', 'closing']
                                        or as_timestamp(states[current_window].last_changed, 0)
                                           == cold_wait_expired[current_window]))))))) }}
        - &dispatch_window_command
          choose:
            - conditions:
                - condition: template
                  alias: "Окно нужно закрыть по актуальным показаниям"
                  value_template: >-
                    {{ full_close_required
                       and (states(current_window) in ['open', 'opening']
                            or (contact_sensor | length > 0 and not is_state(contact_sensor, 'off')
                                and states(current_window) not in ['unknown', 'unavailable']
                                and not (trigger is defined
                                    and trigger.id | default('') == 'window_changed'
                                    and trigger.entity_id | default('') == current_window
                                    and states(current_window) in ['closed', 'closing']))) }}
              sequence:
                - variables:
                    closing_cycles: >-
                      {{ dict(closing_cycles.items() | list
                           + [(current_window, as_timestamp(states[current_window].last_changed, 0))]) }}
                    scheduled_close_windows: >-
                      {{ scheduled_close_windows + [current_window]
                         if periodic_close_due else scheduled_close_windows }}
                - variables:
                    motor_command: "{{ dict(service='cover.close_cover', entity=current_window, data={}, kind='close') }}"
                - *prepare_motor_command
                - action: cover.close_cover
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_window }}"
                - *remember_motor_command
                - alias: "Добавить окно в список проверки закрытия"
                  choose:
                    - conditions:
                        - condition: template
                          alias: "У окна выбран контактный датчик"
                          value_template: "{{ contact_sensor | length > 0 }}"
                      sequence:
                        - variables:
                            closing_requests: "{{ closing_requests + [current_window] }}"
            - conditions:
                - condition: template
                  alias: "Открыть окно в текущем интервале расписания"
                  value_template: >-
                    {{ periodic_active and opening_command_available
                       and (states(current_window) in ['closed', 'closing']
                            or (is_state(current_window, 'open')
                                and ((opening_entity | length > 0 and not opening_level_matches)
                                     or (opening_entity | length == 0 and position_available
                                         and current_position | float < 100))))
                       and (states(current_window) not in ['closed', 'closing']
                            or (trigger is defined and trigger.id | default('') == 'startup')
                            or as_timestamp(states[current_window].last_changed, 0) <= schedule_state.started_at)
                       and not (trigger is defined and trigger.id | default('') == 'window_changed'
                                and trigger.entity_id | default('') == current_window
                                and states(current_window) in ['closed', 'closing']) }}
              sequence:
                - *open_ventilation_window
            - conditions:
                - condition: template
                  alias: "Воздух в норме и можно установить заданное положение окна"
                  value_template: >-
                    {{ control_mode != 'periodic' and not periodic_active and not periodic_close_due
                       and window_action == 'position' and readings.valid and readings.recovered
                       and readings.temperature > minimum_temperature | float
                       and position_available and states(current_window) in ['open', 'closed']
                       and current_position | float != normal_position | int
                       and (current_position | float > normal_position | int
                            or readings.temperature >= reopening_temperature | float) }}
              sequence:
                - variables:
                    motor_command: "{{ dict(service='cover.set_cover_position', entity=current_window, data=dict(position=normal_position | int), kind='position') }}"
                - *prepare_motor_command
                - action: cover.set_cover_position
                  continue_on_error: true
                  target:
                    entity_id: "{{ current_window }}"
                  data:
                    position: "{{ normal_position | int }}"
                - *remember_motor_command
            - conditions:
                - condition: template
                  alias: "Воздух требует проветривания и температура разрешает открытие"
                  value_template: >-
                    {{ control_mode != 'periodic' and not periodic_active and not periodic_close_due
                       and opening_command_available and window_action == 'open'
                       and readings.valid and readings.high and not readings.recovered
                       and readings.temperature >= reopening_temperature | float
                       and (states(current_window) in ['closed', 'closing']
                            or (is_state(current_window, 'open')
                                and ((opening_entity | length > 0 and not opening_level_matches)
                                     or (opening_entity | length == 0 and normal_position | int > 0
                                         and is_number(current_position) and current_position | float < 100)))) }}
              sequence:
                - *open_ventilation_window

        - alias: "Удалить уведомление после закрытия или перехода к приоткрытию"
          choose:
            - conditions:
                - condition: template
                  alias: "Закрытие подтверждено или полное закрытие больше не требуется"
                  value_template: >-
                    {{ contact_sensor | length > 0 and (is_state(contact_sensor, 'off')
                       or (readings.valid and readings.recovered and not full_close_required)) }}
              sequence:
                - action: persistent_notification.dismiss
                  continue_on_error: true
                  data:
                    notification_id: "{{ notification_prefix }}_close_{{ current_window | replace('.', '_') }}"

  # Первоначальные команды уже отправлены всем окнам. Каждый новый Reboot
  # проверяется относительно конкретной попытки; повтор не создаёт новую очередь.
  - &recover_rebooted_commands
    alias: "Повторить потерянные при Reboot команды"
    repeat:
      for_each: "{{ reboot_commands[reboot_processed:] }}"
      sequence:
        - variables:
            reboot_processed: "{{ reboot_processed + 1 }}"
            recovery_command: "{{ repeat.item }}"
            current_window: "{{ repeat.item.window }}"
            contact_sensor: "{{ contacts.get(repeat.item.window, '') }}"
            recovery_sensor: "{{ repeat.item.sensor }}"
            recovery_sent_at: "{{ repeat.item.sent_at }}"
            recovery_report_before: "{{ repeat.item.report_before }}"
            recovery_done: false
            reboot_recovery_in_progress: true
        - repeat:
            count: "{{ reboot_retries | int + 1 }}"
            sequence:
              - condition: template
                alias: "Проверка этой команды ещё не завершена"
                value_template: "{{ not recovery_done }}"
              - wait_template: &new_reboot_event >-
                  {{ states(recovery_sensor) | lower == 'reboot'
                     and as_timestamp(states[recovery_sensor].last_changed, 0) > recovery_report_before
                     and recovery_sent_at <= as_timestamp(states[recovery_sensor].last_changed, 0)
                         <= recovery_sent_at + reboot_watch | float }}
                timeout:
                  seconds: "{{ [0, recovery_sent_at + reboot_watch | float - as_timestamp(now())] | max }}"
                continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: template
                        alias: "После этой попытки зарегистрирован новый Reboot"
                        value_template: *new_reboot_event
                    sequence:
                      - variables:
                          recovery_attempt: "{{ repeat.index }}"
                          ventilation_status: "Перезапуск {{ current_window }}: ожидание повторной команды"
                      - *publish_status
                      - delay:
                          seconds: "{{ reboot_delay | float }}"
                      - wait_template: >-
                          {{ states(current_window) not in ['unknown', 'unavailable']
                             and (recovery_command.service != 'number.set_value'
                                  or (is_number(states(recovery_command.entity))
                                      and state_attr(recovery_command.entity, 'min') | float(0) <= recovery_command.data.value
                                      and recovery_command.data.value <= state_attr(recovery_command.entity, 'max') | float(100))) }}
                        timeout:
                          seconds: "{{ reboot_delay | float }}"
                        continue_on_timeout: true
                      - variables:
                          recovery_ready: "{{ wait.completed }}"
                      - *refresh_temperature_entities
                      - *refresh_readings
                      - *refresh_schedule
                      - *refresh_window_requirements
                      - variables:
                          recovery_fault: "{{ states(recovery_sensor) | lower | replace(' ', '_') }}"
                          recovery_blocked_by_fault: >-
                            {{ recovery_fault in ['high_wind', 'low_battery', 'current_overload',
                               'opening_failed', 'closing_failed', 'external_opening'] }}
                          recovery_needed: >-
                            {% if recovery_blocked_by_fault %}
                              {{ false }}
                            {% elif recovery_command.kind == 'close' %}
                              {{ full_close_required and (contact_sensor | length == 0
                                 or not is_state(contact_sensor, 'off')) }}
                            {% elif recovery_command.kind == 'position' %}
                              {{ not schedule_state.active and control_mode != 'periodic'
                                 and readings.valid and readings.recovered
                                 and (not recovery_ready or position_available)
                                 and readings.temperature > minimum_temperature | float
                                 and normal_position | int == recovery_command.data.position
                                 and (not is_number(current_position)
                                      or current_position | float >= normal_position | int
                                      or readings.temperature >= reopening_temperature | float) }}
                            {% else %}
                              {% set phase_matches = schedule_state.active
                                 and schedule_state.started_at == recovery_command.schedule_start
                                 if recovery_command.phase == 'periodic'
                                 else not schedule_state.active and control_mode != 'periodic' %}
                              {% set target_matches = (opening_entity == recovery_command.entity
                                 and opening_percentage == recovery_command.data.get('value'))
                                 if recovery_command.service == 'number.set_value'
                                 else opening_entity | length == 0 %}
                              {{ phase_matches and target_matches and not full_close_required
                                 and (schedule_state.active or (readings.valid and readings.high and not readings.recovered
                                      and (readings.temperature >= reopening_temperature | float or allow_cold_ventilation)
                                      and (readings.temperature > minimum_temperature | float or cold_close_delay | float > 0))) }}
                            {% endif %}
                      - choose:
                          - conditions:
                              - condition: template
                                alias: "После Reboot привод сообщил другую причину остановки"
                                value_template: "{{ recovery_blocked_by_fault }}"
                            sequence:
                              - variables:
                                  recovery_done: true
                                  ventilation_status: "Повтор отменён для {{ current_window }}: {{ states(recovery_sensor) }}"
                              - *publish_status
                          - conditions:
                              - condition: template
                                alias: "Условия изменились — отменить старую команду"
                                value_template: "{{ not recovery_needed }}"
                            sequence:
                              - variables:
                                  recovery_done: true
                              - *refresh_decision
                              - *publish_status
                              - action: persistent_notification.dismiss
                                continue_on_error: true
                                data:
                                  notification_id: "{{ notification_prefix }}_reboot_{{ current_window | replace('.', '_') }}"
                              - choose:
                                  - conditions:
                                      - condition: template
                                        alias: "После отмены открытия требуется закрытие"
                                        value_template: "{{ recovery_command.kind != 'close' and full_close_required }}"
                                    sequence:
                                      - *dispatch_window_command
                          - conditions:
                              - condition: template
                                alias: "Привод восстановился и разрешена ещё одна попытка"
                                value_template: "{{ recovery_ready and reboot_attempts.get(current_window, 0) < reboot_retries | int }}"
                            sequence:
                              - variables:
                                  recovery_sent_at: "{{ as_timestamp(now()) }}"
                                  recovery_report_before: "{{ as_timestamp(states[recovery_sensor].last_changed, 0) }}"
                                  reboot_attempts: >-
                                    {{ dict(reboot_attempts.items() | list
                                         + [(current_window, reboot_attempts.get(current_window, 0) + 1)]) }}
                              - action: "{{ recovery_command.service }}"
                                continue_on_error: true
                                target:
                                  entity_id: "{{ recovery_command.entity }}"
                                data: "{{ recovery_command.data }}"
                        default:
                          - variables:
                              recovery_done: true
                              ventilation_status: "Команда не выполнена после Reboot: {{ current_window }}"
                          - *publish_status
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ notifications_enabled }}"
                                sequence:
                                  - action: persistent_notification.create
                                    continue_on_error: true
                                    data:
                                      notification_id: "{{ notification_prefix }}_reboot_{{ current_window | replace('.', '_') }}"
                                      title: "Проветривание: команда потеряна при Reboot"
                                      message: >-
                                        {{ current_window }}: {{ recovery_command.service }}.
                                        Повтор не выполнен: привод недоступен или исчерпан лимит
                                        {{ reboot_retries }}. Last event: {{ states(recovery_sensor) }}.
                default:
                  - variables:
                      recovery_done: true
                  - action: persistent_notification.dismiss
                    continue_on_error: true
                    data:
                      notification_id: "{{ notification_prefix }}_reboot_{{ current_window | replace('.', '_') }}"
        - variables:
            reboot_recovery_in_progress: false

  # Запоминаем состояние каждого окна перед ожиданием закрытия по холоду:
  # ожидание предыдущего открытия не должно закрыть следующий цикл.
  # Обычные обновления датчиков не запускают дополнительные ожидания.
  - variables:
      cold_wait_windows: >-
        {% set ns = namespace(items=[]) %}
        {% set event_id = trigger.id | default('') if trigger is defined else '' %}
        {% set can_start = trigger is not defined or cold_opened_windows | count > 0
           or event_id in ['room_cold_or_unavailable', 'startup']
           or (event_id == 'periodic_check' and now().minute % 5 == 0)
           or (event_id == 'window_changed' and trigger.to_state is defined and trigger.to_state is not none
               and trigger.to_state.state in ['open', 'opening']) %}
        {% if control_mode != 'periodic' and not schedule_state.active
           and can_start and cold_close_delay | float > 0
           and readings.valid and not readings.recovered
           and readings.temperature <= minimum_temperature | float %}
          {% for window in windows | unique %}
            {% if (states(window) in ['open', 'opening']
                    or (is_state(window, 'closed') and window in contacts
                        and not is_state(contacts[window], 'off')))
               and (event_id != 'window_changed' or trigger.entity_id | default('') == window
                    or window in cold_opened_windows) %}
              {% set ns.items = ns.items + [(window, as_timestamp(states[window].last_changed, 0))] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ dict(ns.items) }}
  - alias: "Выдержать задержку закрытия по холоду"
    choose:
      - conditions:
          - condition: template
            alias: "Открытые окна требуют задержки закрытия"
            value_template: "{{ cold_wait_windows | count > 0 }}"
        sequence:
          - wait_for_trigger:
              - trigger: template
                value_template: *air_recovered_condition
              - trigger: template
                value_template: *air_unavailable_condition
              - trigger: template
                value_template: >-
                  {% set ns = namespace(values=[], valid=true) %}
                  {% set sensors = selected_temperature_sensors %}
                  {% if sensors | count == 0 %}
                    {% set sensors = area_entities(selected_area)
                       | select('match', '^sensor[.]')
                       | select('is_state_attr', 'device_class', 'temperature') | list %}
                  {% endif %}
                  {% for entity in sensors %}
                    {% set value = states(entity) %}
                    {% set unit = state_attr(entity, 'unit_of_measurement') %}
                    {% if not is_number(value) or unit not in ['°C', '°F', 'K'] %}
                      {% set ns.valid = false %}
                    {% else %}
                      {% set value = value | float %}
                      {% set celsius = (value - 32) * 5 / 9 if unit == '°F'
                         else value - 273.15 if unit == 'K' else value %}
                      {% set ns.values = ns.values + [celsius | round(3)] %}
                    {% endif %}
                  {% endfor %}
                  {{ not ns.valid or ns.values | count == 0
                     or ns.values | min > minimum_temperature | float }}
              - trigger: template
                value_template: >-
                  {% set ns = namespace(pending=false) %}
                  {% for window, opened_at in cold_wait_windows.items() %}
                    {% if (states(window) in ['open', 'opening']
                           or (is_state(window, 'closed') and window in contacts
                               and not is_state(contacts[window], 'off')))
                       and as_timestamp(states[window].last_changed, 0) == opened_at %}
                      {% set ns.pending = true %}
                    {% endif %}
                  {% endfor %}
                  {{ not ns.pending }}
            timeout:
              minutes: "{{ cold_close_delay | float }}"
            continue_on_timeout: true
          - variables:
              cold_wait_expired: "{{ cold_wait_windows if not wait.completed else {} }}"
          - *refresh_temperature_entities
          - *refresh_readings
          - *refresh_schedule
          - *refresh_decision
          - *publish_status
          - repeat:
              for_each: "{{ cold_wait_windows.keys() | list }}"
              sequence:
                - variables:
                    current_window: "{{ repeat.item }}"
                    contact_sensor: "{{ contacts.get(repeat.item, '') }}"
                - *refresh_temperature_entities
                - *refresh_readings
                - *refresh_schedule
                - *refresh_window_requirements
                - *dispatch_window_command

  - *recover_rebooted_commands

  # Сначала команды отправлены всем окнам, затем проверяем контакты.
  # Ожидание одного датчика не задерживает первоначальное закрытие остальных.
  - repeat:
      for_each: "{{ closing_requests }}"
      sequence:
        - variables:
            verification_in_progress: true
            current_window: "{{ repeat.item }}"
            contact_sensor: "{{ contacts[current_window] }}"
        - wait_template: "{{ is_state(contact_sensor, 'off') }}"
          timeout:
            seconds: "{{ confirmation_timeout | float }}"
          continue_on_timeout: true
        - repeat:
            count: "{{ retry_count | int }}"
            sequence:
              - *refresh_temperature_entities
              - *refresh_readings
              - *refresh_schedule
              - *refresh_window_requirements
              - alias: "Повторить закрытие при открытом контакте"
                choose:
                  - conditions:
                      - condition: template
                        alias: "Контакт открыт, привод доступен и закрытие необходимо"
                        value_template: >-
                          {{ is_state(contact_sensor, 'on')
                             and states(current_window) not in ['unknown', 'unavailable']
                             and full_close_required }}
                    sequence:
                      - variables:
                          motor_command: "{{ dict(service='cover.close_cover', entity=current_window, data={}, kind='close') }}"
                      - *prepare_motor_command
                      - action: cover.close_cover
                        continue_on_error: true
                        target:
                          entity_id: "{{ current_window }}"
                      - *remember_motor_command
                      - *recover_rebooted_commands
                      - wait_template: "{{ is_state(contact_sensor, 'off') }}"
                        timeout:
                          seconds: "{{ confirmation_timeout | float }}"
                        continue_on_timeout: true
        - *refresh_temperature_entities
        - *refresh_readings
        - *refresh_schedule
        - *refresh_window_requirements
        - alias: "Обработать результат проверки закрытия"
          choose:
            - conditions:
                - condition: template
                  alias: "Закрытие необходимо, но контакт его не подтвердил"
                  value_template: >-
                    {{ not is_state(contact_sensor, 'off') and full_close_required }}
              sequence:
                - variables:
                    ventilation_status: "Закрытие не подтверждено: проверьте окно и контактный датчик"
                - *publish_status
                - alias: "Уведомить о неподтверждённом закрытии"
                  choose:
                    - conditions:
                        - condition: template
                          alias: "Уведомления включены"
                          value_template: "{{ notifications_enabled }}"
                      sequence:
                        - action: persistent_notification.create
                          continue_on_error: true
                          data:
                            notification_id: "{{ notification_prefix }}_close_{{ current_window | replace('.', '_') }}"
                            title: "Проветривание: окно не подтвердило закрытие"
                            message: >-
                              {{ state_attr(current_window, 'friendly_name') or current_window }}:
                              датчик {{ contact_sensor }} показывает {{ states(contact_sensor) }}
                              после команды закрытия и доступных повторов.
                              Проверьте окно и контактный датчик.
          default:
            - action: persistent_notification.dismiss
              continue_on_error: true
              data:
                notification_id: "{{ notification_prefix }}_close_{{ current_window | replace('.', '_') }}"
