blueprint:
  name: "Light / Nightlight Cycle Control"
  description: >-
    Control main lights and nightlights with a single button.

    During the nighttime interval, cycle through three steps: turn on only
    the nightlights at the configured brightness; add the main lights and
    enable Yeelight night mode using the selected switches; turn everything
    off without changing the mode switches.

    Nightlights turn on steadily by default. A flash can be enabled separately
    if the selected lights support it.

    Outside the nighttime interval, toggle both lighting groups on or off
    in normal mode, without the intermediate nightlight step or a flash.

    Mixed or unexpected lighting states are reset by turning everything off.
    Active Yeelight light.*_nightlight entities are also checked and turned
    off when their corresponding main lights are selected. The interval is evaluated
    on button presses; there are no scheduled mode changes.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    button_triggers:
      name: "Триггеры кнопки"
      description: >-
        The button press that cycles the lighting. Select the original
        MQTT device trigger with the off_b1 action, or any other trigger.
      selector:
        trigger: {}

    main_lights:
      name: "Основное освещение"
      description: >-
        Select one or more main lights. Each light must belong to only
        one group: main lights or nightlights.
      selector:
        entity:
          filter:
            - domain: light
          multiple: true

    night_lights:
      name: "Ночное освещение"
      description: >-
        Select one or more nightlights for the first nighttime step.
        They remain on when the main lights are added in the second step.
      selector:
        entity:
          filter:
            - domain: light
          multiple: true

    night_mode_switches:
      name: "Групповой переключатель ночного режима Yeelight"
      description: >-
        Optional. Select your existing group switch for Yeelight night mode,
        or individual mode switches. Turning the switch on must enable night
        mode; turning it off must restore normal mode. The switches are
        enabled after the main lights are added in the second nighttime step
        and disabled only when turning the lights on in normal daytime mode.
        Turning the lights off preserves the current mode switch state.
        Leave empty to cycle the lights without changing Yeelight mode.
      default: []
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true

    night_start:
      name: "Начало ночного интервала"
      description: >-
        The start of the nighttime interval. During this interval,
        pressing the button when both groups are off turns on only the nightlights.
      default: "22:00:00"
      selector:
        time: {}

    night_end:
      name: "Конец ночного интервала"
      description: >-
        The end of the nighttime interval. Outside this interval,
        pressing the button when both groups are off turns on both groups.
        The interval can span midnight.
      default: "06:00:00"
      selector:
        time: {}

    night_brightness_pct:
      name: "Начальная яркость ночного освещения"
      description: >-
        The nightlight brightness for the first nighttime step.
        Daytime operation does not override brightness.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    enable_night_flash:
      name: "Использовать вспышку при первом включении"
      description: >-
        Optional. Request a flash during the first nighttime step.
        Disabled by default so the nightlights turn on steadily without
        a temporary flash effect. Existing automations also default to disabled.
      default: false
      selector:
        boolean: {}

    night_flash:
      name: "Вспышка при включении ночного освещения"
      description: >-
        The flash duration when the optional flash is enabled.
        The lights must support this feature. No flash is requested during
        daytime operation or when adding the main lights.
      default: long
      selector:
        select:
          options:
            - label: "Короткая"
              value: short
            - label: "Длинная"
              value: long
          mode: dropdown

mode: single

variables:
  night_mode_switches: !input night_mode_switches
  enable_night_flash: !input enable_night_flash
  main_lights: !input main_lights
  # У Yeelight активной может быть виртуальная nightlight-сущность.
  main_off_targets: >-
    {% set ns = namespace(entities=[]) %}
    {% for light in expand(main_lights) %}
      {% set nightlight = light.entity_id ~ '_nightlight' %}
      {% set ns.entities = ns.entities +
        [nightlight if is_state(nightlight, 'on') else light.entity_id] %}
    {% endfor %}
    {{ ns.entities }}
  main_lights_off: >-
    {{ main_off_targets | select('is_state', 'off') | list | count
       == main_off_targets | count }}

triggers: !input button_triggers

conditions: []

actions:
  - if:
      - condition: time
        after: !input night_start
        before: !input night_end
    then:
      - choose:
          # Шаг 1: всё выключено — включаем только ночное освещение.
          - conditions:
              - condition: template
                value_template: "{{ main_lights_off }}"
              - condition: state
                entity_id: !input night_lights
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ enable_night_flash }}"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: !input night_lights
                    data:
                      brightness_pct: !input night_brightness_pct
                      flash: !input night_flash
                else:
                  - action: light.turn_on
                    target:
                      entity_id: !input night_lights
                    data:
                      brightness_pct: !input night_brightness_pct

          # Шаг 2: добавляем основной свет, затем включаем его ночной режим.
          - conditions:
              - condition: template
                value_template: "{{ main_lights_off }}"
              - condition: state
                entity_id: !input night_lights
                state: "on"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: !input main_lights
              - if:
                  - condition: template
                    value_template: "{{ night_mode_switches | length > 0 }}"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: !input night_mode_switches

        # Шаг 3 или смешанное состояние: выключаем всё, сохраняя режим.
        default:
          - action: light.turn_off
            target:
              entity_id: "{{ main_off_targets }}"
          - action: light.turn_off
            target:
              entity_id: !input night_lights

    else:
      # Днём только два состояния: обычный свет включён или всё выключено.
      # Проверяем состояние до смены режима, которая может изменить сущности света.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ main_lights_off }}"
              - condition: state
                entity_id: !input night_lights
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ night_mode_switches | length > 0 }}"
                then:
                  - action: switch.turn_off
                    target:
                      entity_id: !input night_mode_switches
              - action: light.turn_on
                target:
                  entity_id: !input main_lights
              - action: light.turn_on
                target:
                  entity_id: !input night_lights
        default:
          - action: light.turn_off
            target:
              entity_id: "{{ main_off_targets }}"
          - action: light.turn_off
            target:
              entity_id: !input night_lights
