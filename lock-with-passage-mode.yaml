blueprint:
  name: Lock Auto-close with Passage Mode
  description: >
    Закрывает замок при закрытии двери, если текущее время не попадает
    в интервал прохода (Passage Mode) в выбранные дни недели.
    Поддерживает задержку перед закрытием.
    Также автоматически закрывает замок в момент окончания интервала
    прохода, если к этому моменту он остался открытым.
    Замок никогда не закрывается, пока дверь открыта.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    lock_entity:
      name: Замок
      description: Замок, который нужно закрыть.
      selector:
        entity:
          domain: lock
    door_sensor:
      name: Датчик двери
      description: Датчик, который сообщает, что дверь закрыта.
      selector:
        entity:
          domain: binary_sensor
          device_class: door
    lock_delay:
      name: Задержка перед закрытием
      description: >
        Пауза после закрытия двери, прежде чем замок будет заблокирован.
        Если дверь снова откроется в течение этой паузы — закрытие отменяется.
        Оставьте 0, чтобы закрывать сразу.
      default: 0
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: "сек"
          mode: box

    check_interval:
      name: Интервал периодической проверки
      description: >
        Интервал (в минутах), через который замок будет проверяться и закрываться,
        если он открыт и мы не в Passage Mode. Используйте формат /X (например, /15 для каждых 15 минут).
      default: "/15"
      selector:
        text: {}
    passage_mode:
      name: Passage Mode
      icon: mdi:door-open
      description: >
        Интервал времени и дни недели, в которые автозакрытие отключено.
        Необязательно — если оставить оба значения одинаковыми
        (по умолчанию 00:00:00), интервал не действует и замок
        закрывается в любое время. Дни относятся к началу интервала:
        понедельник 22:00–06:00 означает проход до вторника 06:00.
      collapsed: true
      input:
        passage_weekdays:
          name: Дни недели для режима прохода
          description: >
            Дни начала интервала прохода. По умолчанию — каждый день.
            В остальные дни действует обычное автозакрытие.
            Если не выбрать ни одного дня, режим прохода отключён.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Понедельник
                  value: mon
                - label: Вторник
                  value: tue
                - label: Среда
                  value: wed
                - label: Четверг
                  value: thu
                - label: Пятница
                  value: fri
                - label: Суббота
                  value: sat
                - label: Воскресенье
                  value: sun

        passage_start_time:
          name: Начало интервала прохода
          description: Время, когда замок перестаёт автозакрываться.
          default: "00:00:00"
          selector:
            time: {}
        passage_end_time:
          name: Конец интервала прохода
          description: >
            Время, когда автозакрытие снова становится активным. Если
            в этот момент замок открыт — он будет заблокирован.
          default: "00:00:00"
          selector:
            time: {}

# single: периодическая проверка / конец интервала не прерывают ожидание
# задержки и не обходят её.
mode: single
max_exceeded: silent

variables:
  passage_start: !input passage_start_time
  passage_end: !input passage_end_time
  passage_days: !input passage_weekdays
  # Для ночного интервала после полуночи проверяем день его начала.
  passage_active: >-
    {% set current = now() %}
    {% set start = today_at(passage_start) %}
    {% set end = today_at(passage_end) %}
    {% set weekdays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] %}
    {% if start > end %}
      {% if current < end %}
        {% set start = start - timedelta(days=1) %}
      {% else %}
        {% set end = end + timedelta(days=1) %}
      {% endif %}
    {% endif %}
    {{ weekdays[start.weekday()] in passage_days and start <= current < end }}
  # Триггер времени срабатывает каждый день; закрываем только в конце
  # интервала, который начался в выбранный день недели.
  passage_end_scheduled: >-
    {% set start = today_at(passage_start) %}
    {% set end = today_at(passage_end) %}
    {% set weekdays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] %}
    {% set start_day = (now().weekday() - (1 if start > end else 0)) % 7 %}
    {{ start != end and weekdays[start_day] in passage_days }}

triggers:
  - trigger: state
    entity_id: !input door_sensor
    from: "on"
    to: "off"
    id: door_closed
  - trigger: time
    at: !input passage_end_time
    id: passage_end
  - trigger: time_pattern
    minutes: !input check_interval
    id: periodic_check

conditions: []

actions:
  - choose:
      # Сценарий 1: дверь закрылась и мы не в интервале прохода
      - conditions:
          - condition: trigger
            id: door_closed
          - condition: template
            value_template: "{{ not passage_active }}"
        sequence:
          - delay:
              seconds: !input lock_delay
          # дверь могли снова открыть за время задержки
          - condition: state
            entity_id: !input door_sensor
            state: "off"
          - action: lock.lock
            target:
              entity_id: !input lock_entity

      # Сценарий 2: наступил конец интервала прохода — если замок открыт
      # и дверь закрыта, закрыть замок
      - conditions:
          - condition: trigger
            id: passage_end
          # Не закрывать по расписанию в дни без интервала прохода.
          - condition: template
            value_template: "{{ passage_end_scheduled }}"
          - condition: state
            entity_id: !input lock_entity
            state: "unlocked"
          - condition: state
            entity_id: !input door_sensor
            state: "off"
        sequence:
          - action: lock.lock
            target:
              entity_id: !input lock_entity

      # Сценарий 3: периодическая проверка — закрыть, если замок открыт,
      # дверь закрыта и мы не в Passage Mode
      - conditions:
          - condition: trigger
            id: periodic_check
          - condition: state
            entity_id: !input lock_entity
            state: "unlocked"
          - condition: state
            entity_id: !input door_sensor
            state: "off"
          - condition: template
            value_template: "{{ not passage_active }}"
        sequence:
          - action: lock.lock
            target:
              entity_id: !input lock_entity
