blueprint:
  name: "Night Lighting by Occupancy (Full Customization)"
  description: "Включает свет / Yeelight Moonlight-mode / Ambilight в заданный интервал времени по датчику присутствия. С выбором типа ночного режима и настраиваемым временем автовыключения."
  domain: automation
  source_url: https://github.com/eldarsudden/ha-blueprints/blob/master/night-lighting-occupancy.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    target_area:
      name: Area
      description: "Выберите комнату, для которой будет работать сценарий"
      selector:
        area:
          multiple: false
          reorder: false
    night_mode_type:
      name: Night Mode Type
      description: "Какой режим использовать как ночной: Moonlight-mode (обычная лампа в лунном режиме) или Ambilight (только фоновая подсветка, если лампа её поддерживает)"
      default: moonlight
      selector:
        select:
          mode: dropdown
          options:
          - label: Moonlight mode
            value: moonlight
          - label: Ambilight (фоновая подсветка)
            value: ambilight
          multiple: false
          custom_value: false
          sort: false
    night_start:
      name: Start Time
      description: "Начало ночного режима"
      default: "00:00:00"
      selector:
        time: {}
    night_end:
      name: End Time
      description: "Конец ночного режима"
      default: "06:00:00"
      selector:
        time: {}
    clear_delay:
      name: Off Delay
      description: "Время отсутствия присутствия перед выключением света"
      default:
        seconds: 60
      selector:
        duration:
          enable_second: true

    home_mode_entities:
      name: "Режим дома (опционально)"
      description: >-
        Optional input_select helper. Sleep mode enables night lighting
        regardless of the clock; Away mode suppresses automatic light
        commands. Leave empty to use the existing time schedule only.
      default: []
      selector:
        entity:
          filter:
          - domain:
            - input_select
          multiple: true
          reorder: false
    turn_off_main_in_ambilight:
      name: "Выключать основной свет при Ambilight"
      description: >-
        Preserve the preferred normal-time behavior. Sleep mode always
        turns the main lights off when enabling Ambilight night lighting.
      default: true
      selector:
        boolean: {}
    sleep_mode_value:
      name: "Название режима сна"
      default: "Сон"
      selector:
        text:
          multiline: false
          multiple: false
    away_mode_value:
      name: "Название режима отсутствия"
      default: "Ушли"
      selector:
        text:
          multiline: false
          multiple: false

mode: restart

triggers:
  - trigger: occupancy.detected
    target:
      area_id: !input target_area
    options:
      behavior: each
  - trigger: occupancy.cleared
    target:
      area_id: !input target_area
    options:
      behavior: each
      for: !input clear_delay
  - trigger: state
    entity_id: !input home_mode_entities
    to: null
    id: home_mode_changed
  - trigger: homeassistant
    event: start
    id: startup

conditions:
  - condition: template
    value_template: >-
      {{ home_mode_entities | select('is_state', away_mode_value) | list | count == 0 }}

variables:
  target_area: !input target_area
  night_mode_type: !input night_mode_type
  home_mode_entities: !input home_mode_entities
  sleep_mode_value: !input sleep_mode_value
  away_mode_value: !input away_mode_value
  turn_off_main_in_ambilight: !input turn_off_main_in_ambilight
  ambilight_entities: >-
    {{ area_entities(target_area) | select('match', '.*_ambilight$') | list }}
  main_entities: >-
    {{ area_entities(target_area)
       | select('match', '^light\..*')
       | reject('match', '.*_ambilight$')
       | list }}

actions:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: time
                after: !input night_start
                before: !input night_end
              - condition: template
                value_template: >-
                  {{ home_mode_entities | select('is_state', sleep_mode_value) | list | count > 0 }}
          - condition: occupancy.is_detected
            target:
              area_id: !input target_area
            options:
              behavior: any
        sequence:
          - choose:
              # --- Ночной режим: Moonlight ---
              - conditions:
                  - condition: template
                    value_template: "{{ night_mode_type == 'moonlight' }}"
                sequence:
                  - action: yeelight.set_mode
                    data:
                      mode: moonlight
                    target:
                      area_id: !input target_area
                  - action: light.turn_on
                    target:
                      entity_id: "{{ main_entities }}"
                    data: {}
                  - action: light.turn_off
                    target:
                      entity_id: "{{ ambilight_entities }}"
                    data: {}
              # --- Ночной режим: Ambilight ---
              - conditions:
                  - condition: template
                    value_template: "{{ night_mode_type == 'ambilight' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ turn_off_main_in_ambilight
                             or home_mode_entities | select('is_state', sleep_mode_value) | list | count > 0 }}
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: "{{ main_entities }}"
                        data: {}
                  - action: light.turn_on
                    target:
                      entity_id: "{{ ambilight_entities }}"
                    data: {}
      - conditions:
          - condition: occupancy.is_not_detected
            target:
              area_id: !input target_area
            options:
              behavior: any
        sequence:
          - action: light.turn_off
            target:
              area_id: !input target_area
            data: {}
