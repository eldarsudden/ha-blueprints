blueprint:
  name: Open Window Detector v3
  description: >
    Автоматика для отключения климатических устройств (термостаты, кондиционеры)
    при открытии окна/двери и их восстановления при закрытии.

    Поддерживает два режима восстановления состояния —
    "снапшот" (текущее состояние climate-устройств фиксируется в момент
    срабатывания датчика на открытие, перед выключением устройства,
    для каждого доступного устройства отдельно
    и сохраняется до успешного выполнения восстановления) и "фиксированное состояние"
    (при закрытии устройства переводятся в заданный пользователем набор
    действий, а не в то состояние, которое было до выключения).

    Поддерживается:
      - произвольный список climate-устройств для управления;
      - независимое выключение и восстановление устройств: ошибка одного
        устройства не мешает остальным;
      - пропуск недоступных устройств при сохранении состояния;
      - повтор восстановления оставшихся снимков раз в минуту, пока окно
        закрыто; при ошибке снимок не удаляется.

    Снимки временные: перезапуск Home Assistant или перезагрузка сцен
    удаляет их. Устройство, недоступное при открытии окна, не имеет снимка
    и не восстанавливается автоматически.

    Также поддерживаются:
      - защита от дребезга датчика (anti-flapping) — задержка перед
        реакцией на изменение состояния;
      - дополнительные пользовательские действия, выполняемые после
        выключения и после восстановления устройств.

    Требуется Home Assistant 2024.4 или новее (используется переменная `this`).
    Датчик-триггер должен быть binary_sensor, где состояние "on" означает
    "открыто" (стандартное поведение для device_class window/door/opening).
  domain: automation
  source_url: https://www.home-assistant.io/docs/blueprint/
  input:
    trigger_sensor:
      name: Датчик-триггер
      description: >
        Бинарный датчик окна/двери. Состояние "on" считается "открыто"
        (climate выключается), "off" — "закрыто" (climate восстанавливается).
      selector:
        entity:
          domain: binary_sensor

    climate_entities:
      name: Климатические устройства
      description: Термостаты / кондиционеры, которые нужно выключать и восстанавливать.
      selector:
        entity:
          domain: climate
          multiple: true

    restore_mode:
      name: Режим восстановления состояния
      description: >
        Снапшот — состояние устройств (режим, температура, fan_mode и т.д.)
        фиксируется в момент срабатывания на открытие, до выполнения
        каких-либо действий. Повторное открытие до восстановления не
        перезаписывает сохранённое состояние уже выключенных устройств.
        Недоступные устройства пропускаются. Ошибки восстановления
        изолированы; оставшиеся снимки повторяются раз в минуту при закрытом окне.
        Фиксированное состояние — при закрытии выполняются заданные
        вами действия (ниже), а не восстановление предыдущего состояния.
      default: snapshot
      selector:
        select:
          options:
            - label: "Снапшот (сохранить текущее состояние)"
              value: snapshot
            - label: "Фиксированное состояние (задать вручную)"
              value: fixed

    fixed_state_action:
      name: Действия для фиксированного состояния
      description: >
        Используется только при выборе режима "Фиксированное состояние".
        Опишите здесь действия, которые нужно выполнить для перевода
        климатических устройств в заданное состояние (например,
        climate.set_hvac_mode + climate.set_temperature).
      default: []
      selector:
        action: {}

    flapping_delay:
      name: Задержка от дребезга (anti-flapping)
      description: >
        Время в секундах, в течение которого состояние датчика должно
        оставаться стабильным, прежде чем автоматика сработает.
        Помогает избежать частых включений/выключений при "дребезжащем" датчике.
      default: 5
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
          mode: box

    actions_after_off:
      name: Действия после выключения
      description: Дополнительные действия, выполняемые сразу после выключения климата.
      default: []
      selector:
        action: {}

    actions_after_on:
      name: Действия после включения
      description: >
        Дополнительные действия после попытки восстановления при закрытии окна,
        в том числе при частичном восстановлении. При ежеминутных повторных
        попытках эти действия не выполняются.
      default: []
      selector:
        action: {}

# События обрабатываются последовательно, чтобы новое открытие или закрытие
# не прерывало сохранение и восстановление состояния.
mode: queued
max: 10

variables:
  climate_entities: !input climate_entities
  restore_mode: !input restore_mode
  scene_object_id: "climate_snapshot_{{ this.entity_id.split('.')[1] }}"

trigger:
  - platform: state
    entity_id: !input trigger_sensor
    to: "on"
    for:
      seconds: !input flapping_delay
    id: opened
  - platform: state
    entity_id: !input trigger_sensor
    to: "off"
    for:
      seconds: !input flapping_delay
    id: closed
  - platform: time_pattern
    minutes: "/1"
    id: retry_restore

# Повторяем только незавершённое восстановление при стабильно закрытом окне.
condition:
  - condition: or
    conditions:
      - condition: trigger
        id:
          - opened
          - closed
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ restore_mode == 'snapshot' }}"
          - condition: state
            entity_id: !input trigger_sensor
            state: "off"
            for:
              seconds: !input flapping_delay
          - condition: template
            value_template: >-
              {% set ns = namespace(pending=false) %}
              {% for scene in states.scene %}
                {% if scene.entity_id == 'scene.' ~ scene_object_id
                   or scene.entity_id.startswith('scene.' ~ scene_object_id ~ '_climate_') %}
                  {% set ns.pending = true %}
                {% endif %}
              {% endfor %}
              {{ ns.pending }}

action:
  - choose:
      # --- Триггер "открыто" ---
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - condition: state
            entity_id: !input trigger_sensor
            state: "on"
          - repeat:
              for_each: "{{ climate_entities }}"
              sequence:
                - variables:
                    device_scene_id: "{{ scene_object_id ~ '_' ~ (repeat.item | replace('.', '_')) }}"
                - if:
                    - condition: template
                      value_template: >-
                        {{ states(repeat.item) not in ['unknown', 'unavailable'] }}
                  then:
                    # Изолируем ошибку сохранения вместе с выключением: если
                    # снимок не создан, это устройство оставляем включённым.
                    - choose: []
                      continue_on_error: true
                      default:
                        - if:
                            - condition: template
                              value_template: >-
                                {{ restore_mode == 'snapshot' and
                                   states.scene | selectattr('entity_id', 'eq', 'scene.' ~ device_scene_id) | list | count == 0 and
                                   states.scene | selectattr('entity_id', 'eq', 'scene.' ~ scene_object_id) | list | count == 0 }}
                          then:
                            - service: scene.create
                              data:
                                scene_id: "{{ device_scene_id }}"
                                snapshot_entities: "{{ [repeat.item] }}"
                        - service: climate.turn_off
                          target:
                            entity_id: "{{ repeat.item }}"
          - choose: []
            default: !input actions_after_off

      # --- Закрытие окна или повтор незавершённого восстановления ---
      - conditions:
          - condition: trigger
            id:
              - closed
              - retry_restore
        sequence:
          # В очереди окно могло снова открыться: не восстанавливаем климат.
          - condition: state
            entity_id: !input trigger_sensor
            state: "off"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ restore_mode == 'snapshot' }}"
                sequence:
                  - repeat:
                      for_each: "{{ climate_entities }}"
                      sequence:
                        - variables:
                            device_scene_id: "{{ scene_object_id ~ '_' ~ (repeat.item | replace('.', '_')) }}"
                        - if:
                            - condition: template
                              value_template: >-
                                {{ states(repeat.item) not in ['unknown', 'unavailable'] and
                                   states.scene | selectattr('entity_id', 'eq', 'scene.' ~ device_scene_id) | list | count > 0 }}
                          then:
                            # Ошибка прерывает только этот блок: scene.delete
                            # не выполняется, а цикл переходит к следующему устройству.
                            - choose: []
                              continue_on_error: true
                              default:
                                - service: scene.turn_on
                                  target:
                                    entity_id: "scene.{{ device_scene_id }}"
                                - service: scene.delete
                                  target:
                                    entity_id: "scene.{{ device_scene_id }}"
                  # Совместимость с общим снимком, созданным старой версией.
                  # Его нельзя разделить: повторяем целиком и сохраняем при ошибке.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states.scene | selectattr('entity_id', 'eq', 'scene.' ~ scene_object_id) | list | count > 0 }}
                    then:
                      - choose: []
                        continue_on_error: true
                        default:
                          - service: scene.turn_on
                            target:
                              entity_id: "scene.{{ scene_object_id }}"
                          - service: scene.delete
                            target:
                              entity_id: "scene.{{ scene_object_id }}"
              - conditions:
                  - condition: template
                    value_template: "{{ restore_mode == 'fixed' }}"
                sequence: !input fixed_state_action
          # Пользовательские действия выполняются только на закрытие окна,
          # а не на каждый повтор восстановления отдельного устройства.
          - if:
              - condition: trigger
                id: closed
            then:
              - choose: []
                default: !input actions_after_on
