blueprint:
  name: "UV Recirculator Presence and Schedule Control"
  description: >-
    Управляет закрытым UV-рециркулятором через умную розетку по присутствию
    и расписанию непрерывной работы.

    При обнаружении присутствия розетка включается независимо от расписания.
    После окончания присутствия рециркулятор продолжает работать в течение
    заданного времени и выключается только вне диапазона непрерывной работы.
    Повторное присутствие отменяет ожидаемое выключение.

    В заданном временном диапазоне розетка включена постоянно независимо
    от присутствия. По умолчанию это ночное время с 22:00 до 08:00.
    Диапазон может проходить через полночь. Одинаковые начало и конец
    разрешают круглосуточную работу. После окончания диапазона розетка
    выключается, если присутствия нет и задержка после ухода уже истекла.
    Задержка отсчитывается от окончания присутствия, а не от конца расписания.

    Недоступное или неизвестное состояние датчика присутствия не выключает
    розетку, но включение по расписанию продолжает работать. После перезапуска
    Home Assistant расписание восстанавливается по текущему времени, а отсчёт
    задержки отсутствия начинается заново. Состояния проверяются раз в минуту.

    При необходимости общее время включённого состояния розетки можно
    накапливать в помощнике input_number.
  domain: automation
  homeassistant:
    min_version: 2024.10.0

  input:
    plug_entity:
      name: "Умная розетка"
      description: "Switch-сущность розетки, к которой подключён рециркулятор."
      selector:
        entity:
          filter:
            - domain: switch

    presence_sensor:
      name: "Датчик присутствия"
      description: >-
        Бинарный датчик, у которого состояние on означает присутствие,
        а off — отсутствие. Можно выбрать группу бинарных датчиков.
      selector:
        entity:
          filter:
            - domain: binary_sensor

    absence_delay:
      name: "Работа после окончания присутствия"
      description: >-
        Через какое время непрерывного отсутствия разрешить выключение
        рециркулятора. В пределах заданного временного диапазона
        розетка остаётся включённой независимо от этой задержки.
      default:
        hours: 0
        minutes: 45
        seconds: 0
      selector:
        duration: {}

    schedule_start:
      name: "Начало непрерывной работы"
      description: "С этого времени розетка постоянно включена независимо от присутствия."
      default: "22:00:00"
      selector:
        time: {}

    schedule_end:
      name: "Конец непрерывной работы"
      description: >-
        После этого времени розетка работает только по присутствию
        и задержке после ухода. Если конец раньше начала, диапазон
        продолжается после полуночи. Одинаковые начало и конец задают
        круглосуточную работу.
      default: "08:00:00"
      selector:
        time: {}

    runtime_counter:
      name: "Счётчик времени работы"
      description: >-
        Необязательный помощник input_number, в котором накапливается общее
        время включённого состояния розетки в часах. Создайте помощник с
        единицей измерения «ч», минимальным значением 0, достаточно большим
        максимальным значением и шагом не больше 0,01. Точность подсчёта —
        около одной минуты. Оставьте поле пустым, чтобы не вести подсчёт.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_number

# Запуски выполняются последовательно. Условия повторно вычисляются внутри
# каждого запуска, чтобы ожидавшее в очереди событие не использовало старые
# состояния присутствия или расписания.
mode: queued
max: 10

variables:
  plug: !input plug_entity
  presence: !input presence_sensor
  start_time: !input schedule_start
  end_time: !input schedule_end
  runtime_counter_entity: !input runtime_counter

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    to: "on"
    id: presence_detected

  - trigger: state
    entity_id: !input presence_sensor
    to: "off"
    for: !input absence_delay
    id: absence_elapsed

  - trigger: time_pattern
    minutes: "/1"
    id: periodic_check

  - trigger: time
    at: !input schedule_start
    id: schedule_start

  - trigger: time
    at: !input schedule_end
    id: schedule_end

  - trigger: homeassistant
    event: start
    id: startup

  # Ручное переключение и восстановление доступности розетки.
  - trigger: state
    entity_id: !input plug_entity
    to: null
    id: plug_changed

conditions: []

actions:
  - variables:
      schedule_active: >-
        {% set current = now() %}
        {% set start = today_at(start_time) %}
        {% set end = today_at(end_time) %}
        {% if start == end %}
          {{ true }}
        {% elif start < end %}
          {{ start <= current < end }}
        {% else %}
          {{ current >= start or current < end }}
        {% endif %}

  - if:
      - condition: trigger
        id: periodic_check
      - condition: template
        alias: "Выбран счётчик, розетка включена"
        value_template: >-
          {{ runtime_counter_entity | length > 0
             and states(runtime_counter_entity) not in ['unknown', 'unavailable']
             and is_state(plug, 'on') }}
    then:
      - action: input_number.set_value
        alias: "Добавить одну минуту к времени работы"
        # Ошибка необязательного счётчика не должна прерывать управление розеткой.
        continue_on_error: true
        target:
          entity_id: "{{ runtime_counter_entity }}"
        data:
          value: >-
            {% set current_hours = states(runtime_counter_entity) | float(0) %}
            {% set maximum = state_attr(runtime_counter_entity, 'max') | float(1000000) %}
            {{ [current_hours + 1 / 60, maximum] | min }}

  - choose:
      - conditions:
          - condition: template
            alias: "Есть присутствие или идёт непрерывная работа по расписанию"
            value_template: >-
              {{ schedule_active or is_state(presence, 'on') }}
          - condition: template
            value_template: "{{ is_state(plug, 'off') }}"
        sequence:
          - action: switch.turn_on
            alias: "Включить рециркулятор"
            continue_on_error: true
            target:
              entity_id: !input plug_entity

      - conditions:
          - condition: template
            alias: "Диапазон непрерывной работы закончился"
            value_template: "{{ not schedule_active }}"
          - condition: state
            entity_id: !input presence_sensor
            state: "off"
            for: !input absence_delay
          - condition: template
            value_template: "{{ is_state(plug, 'on') }}"
        sequence:
          - action: switch.turn_off
            alias: "Выключить после отсутствия и расписания"
            continue_on_error: true
            target:
              entity_id: !input plug_entity
