blueprint:
  name: "Nightlight Mode Toggle v3"
  description: >
    По триггеру переключает ночной и обычный режимы. Сущности состояния
    с on означают ночной режим, с off — обычный. Для каждого режима
    выполняется свой набор действий, в том числе для групп Zigbee2MQTT.
    Действия должны обновлять выбранные сущности состояния, чтобы
    следующее нажатие переключало режим обратно.

    Для устройств без Yeelight выключите опцию «Переключать режим Yeelight»,
    укажите сущности состояния и действия для обоих режимов. Область
    не требуется. Если сущности состояния не заданы, действия не выполняются.

    Опция Yeelight по умолчанию включена для совместимости: вызывает
    yeelight.set_mode для выбранной области. Если сущности состояния
    не заданы, автоматически находит light.*_nightlight и switch.*_nightlight
    у устройств Yeelight. В этом режиме приоритет имеют сущности, чьи
    основные лампы включены; если включённых ламп нет — учитываются все.

    Только в режиме Yeelight можно дополнительно приостановить Adaptive
    Lighting до выключения и повторного включения лампы. Для паузы без
    таймера установите autoreset_control_seconds: 0 в Adaptive Lighting.
  domain: automation
  source_url: https://community.home-assistant.io/

  input:
    trigger_section:
      name: "Триггер"
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        trigger_source:
          name: "Триггер"
          description: >
            Событие/устройство, которое запускает переключение режима
            (например нажатие кнопки, датчик и т.д.).
          selector:
            trigger: {}

    target_section:
      name: "Yeelight (опционально)"
      icon: mdi:lightbulb-multiple
      collapsed: false
      input:
        enable_yeelight:
          name: "Переключать режим Yeelight"
          description: >
            Вызывает yeelight.set_mode для выбранной области. Отключите
            для других устройств, включая группы Zigbee2MQTT: будут
            выполняться только выбранные действия для каждого режима.
            По умолчанию включено для совместимости с существующими автоматизациями.
          default: true
          selector:
            boolean: {}

        target_area:
          name: "Область (Area) с лампами Yeelight"
          description: >
            Требуется только при включённой опции Yeelight.
            Лампы Yeelight, для которых будет вызываться yeelight.set_mode.
          default: ""
          selector:
            area:
              entity:
                - integration: yeelight
                  domain: light

    control_section:
      name: "Управление"
      icon: mdi:light-switch
      collapsed: false
      input:
        nightlight_entities:
          name: "Сущности состояния ночного режима"
          description: >
            on — ночной режим, off — обычный. Можно выбрать сущности любой
            интеграции: light, switch, input_boolean и другие с состояниями
            on/off, включая группы Z2M. В общем режиме обязательны.
            Выбранные действия должны менять их состояние.
            Если включена опция Yeelight, можно оставить пустым для
            автопоиска light.*_nightlight и switch.*_nightlight в области.
          default: []
          selector:
            entity:
              multiple: true

        desync_priority:
          name: "Приоритет при рассинхронизации"
          description: >
            Применяется только когда часть проверяемых сущностей в Nightlight,
            а часть — в обычном режиме (когда все сущности уже
            синхронизированы, блюпринт всегда работает как обычный toggle).
          default: nightlight
          selector:
            select:
              options:
                - label: "Переключить все в Nightlight (по умолчанию)"
                  value: nightlight
                - label: "Переключить все в обычный режим"
                  value: normal
              mode: dropdown

    adaptive_lighting_section:
      name: "Adaptive Lighting"
      icon: mdi:theme-light-dark
      collapsed: true
      input:
        pause_adaptive_lighting:
          name: "Приостановить адаптацию до следующего включения"
          description: >
            Применяется только при включённой опции Yeelight.
            После переключения в Nightlight или обычный режим временно
            приостанавливает Adaptive Lighting для ламп Yeelight выбранной
            области. Устройства и управляющие ими настройки Adaptive Lighting
            определяются автоматически, выбирать переключатели не нужно.
            Адаптация возобновляется после выключения и повторного включения
            лампы. Для паузы без таймера установите autoreset_control_seconds: 0
            в Adaptive Lighting. По умолчанию опция выключена.
          default: false
          selector:
            boolean: {}

    actions_section:
      name: "Действия для режимов"
      icon: mdi:script-text
      collapsed: false
      input:
        nightlight_mode_extra_actions:
          name: "Действия для ночного режима"
          description: >
            В общем режиме выполняются сразу после определения целевого режима.
            С опцией Yeelight — после yeelight.set_mode и паузы Adaptive Lighting.
          default: []
          selector:
            action: {}

        normal_extra_actions:
          name: "Действия для обычного режима"
          description: >
            В общем режиме выполняются сразу после определения целевого режима.
            С опцией Yeelight — после yeelight.set_mode и паузы Adaptive Lighting.
          default: []
          selector:
            action: {}

mode: single
max_exceeded: silent

triggers: !input trigger_source

actions:
  # Все inputs — сразу переменными (в т.ч. списки extra-actions: без этого
  # "{{ (nightlight_mode_extra_actions | count) > 0 }}" ниже видел бы
  # undefined и условие всегда было бы false).
  - variables:
      enable_yeelight: !input enable_yeelight
      selected_area: !input target_area
      nightlight_override: !input nightlight_entities
      desync_priority: !input desync_priority
      nightlight_mode_extra_actions: !input nightlight_mode_extra_actions
      normal_extra_actions: !input normal_extra_actions
      pause_adaptive_lighting: !input pause_adaptive_lighting

  # "Основные" light-сущности в области (виртуальные *_nightlight
  # исключены — это индикаторы/переключатели режима, а не сами лампы).
  - variables:
      area_lights: >-
        {{ (area_entities(selected_area) if enable_yeelight and selected_area else [])
           | select('in', integration_entities('yeelight') if enable_yeelight else [])
           | select('match', '^light\.')
           | reject('match', '^light\..*nightlight')
           | list }}

  # Сущности, по которым определяем текущий режим: заданные вручную
  # (если есть) — иначе автопоиск по устройствам area_lights. Ищем сразу
  # оба варианта: light.*_nightlight И switch.*_nightlight, в зависимости
  # от того, как настроен nightlight_switch_type у конкретной лампы.
  - variables:
      nightlight_targets: >-
        {% if nightlight_override | count > 0 %}
          {{ nightlight_override }}
        {% else %}
          {% set ns = namespace(list=[]) %}
          {% for light in area_lights %}
            {% set dev_id = device_id(light) %}
            {% if dev_id %}
              {% set nl = device_entities(dev_id)
                 | select('match', '^(light|switch)\..*nightlight')
                 | list %}
              {% set ns.list = ns.list + nl %}
            {% endif %}
          {% endfor %}
          {{ ns.list | unique | list }}
        {% endif %}

  # Только для Yeelight оставляем сущности с включённой основной лампой.
  # Для других интеграций используем выбранные сущности напрямую:
  # у группы Z2M или input_boolean может не быть основного light-устройства.
  - variables:
      targets_with_on_light: >-
        {% set ns = namespace(list=[]) %}
        {% for nl in (nightlight_targets if enable_yeelight else []) %}
          {% set dev_id = device_id(nl) %}
          {% set dev_lights = (device_entities(dev_id) if dev_id else [])
             | select('match', '^light\.')
             | reject('match', '^light\..*nightlight')
             | list %}
          {% if dev_lights | select('is_state', 'on') | list | count > 0 %}
            {% set ns.list = ns.list + [nl] %}
          {% endif %}
        {% endfor %}
        {{ ns.list }}

  # Если есть nightlight-сущности с включённой основной лампой — проверяем
  # только их. Если ни одна лампа не включена — проверяем весь список
  # (fallback), чтобы триггер всё равно сработал.
  - variables:
      ref_nightlight_targets: >-
        {{ targets_with_on_light if targets_with_on_light | count > 0
           else nightlight_targets }}
      ref_total: "{{ ref_nightlight_targets | count }}"
      nightlight_on_count: >-
        {{ ref_nightlight_targets | select('is_state', 'on') | list | count }}

  # В общем режиме без сущностей невозможно определить, какую ветку запускать.
  # Для Yeelight область обязательна: пустая цель не должна попасть в сервис.
  - condition: template
    alias: "Проверить настройки выбранного режима управления"
    value_template: >-
      {{ (enable_yeelight and selected_area | length > 0)
         or (not enable_yeelight and ref_total > 0) }}

  # Итоговое целевое состояние (true = включить Nightlight всем,
  # false = вернуть всех в обычный режим).
  #   ref_total == 0                   → normal (нет данных)
  #   nightlight_on_count == 0         → все сейчас в normal  → toggle в Nightlight
  #   nightlight_on_count == ref_total → все сейчас в Nightlight → toggle в normal
  #   иначе (рассинхронизация)         → решает desync_priority
  - variables:
      target_nightlight_mode: >-
        {% if ref_total == 0 %}
          {{ false }}
        {% elif nightlight_on_count == 0 %}
          {{ true }}
        {% elif nightlight_on_count == ref_total %}
          {{ false }}
        {% else %}
          {{ desync_priority == 'nightlight' }}
        {% endif %}

  # Один вызов сервиса на всю область — режим выбирается шаблоном,
  # вместо двух дублирующихся веток "moonlight"/"normal".
  - if:
      - condition: template
        value_template: "{{ enable_yeelight }}"
    then:
      - action: yeelight.set_mode
        target:
          area_id: "{{ selected_area }}"
        data:
          mode: "{{ 'moonlight' if target_nightlight_mode else 'normal' }}"

  # Помечаем обе light-сущности Yeelight (обычную и nightlight), если
  # они есть в области. Состояние основной сущности при смене режима
  # может стать off, поэтому ручное управление задаём после set_mode.
  - if:
      - condition: template
        value_template: >-
          {{ enable_yeelight and pause_adaptive_lighting and
             expand(integration_entities('adaptive_lighting'))
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | list | count > 0 }}
    then:
      - variables:
          adaptive_lighting_lights: >-
            {{ area_entities(selected_area)
               | select('in', integration_entities('yeelight'))
               | select('match', '^light\.')
               | list }}
      - if:
          - condition: template
            value_template: "{{ adaptive_lighting_lights | count > 0 }}"
        then:
          # Без entity_id интеграция сама находит управляющий профиль.
          # По одной лампе: в области могут быть разные профили адаптации.
          - repeat:
              for_each: "{{ adaptive_lighting_lights }}"
              sequence:
                - action: adaptive_lighting.set_manual_control
                  # Лампа может не входить в Adaptive Lighting: её ошибка
                  # не мешает обработке остальных и дополнительным действиям.
                  continue_on_error: true
                  data:
                    lights: "{{ [repeat.item] }}"
                    manual_control: true

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ target_nightlight_mode
                 and (nightlight_mode_extra_actions | count) > 0 }}
        sequence: !input nightlight_mode_extra_actions

      - conditions:
          - condition: template
            value_template: >-
              {{ not target_nightlight_mode
                 and (normal_extra_actions | count) > 0 }}
        sequence: !input normal_extra_actions
